openapi: 3.0.3

info:
  title: Starfetch Investment Limited — Platform API
  version: 0.6.1
  description: |
    Canonical API contract for the Starfetch platform (one API serving the public
    website, investor web portal, staff/admin portal, and the future Android/iOS
    React Native clients).

    **Implemented scope:** Phase 2A–2D foundations, authentication and investor
    profile/dashboard reads; gated Corporate O2 creation; owner-scoped O3/O11
    reads; O4 optimistic draft amendments with immutable versioned history;
    Corporate application discovery; and immutable verification-snapshot
    freshness/regeneration staging. TIN writes remain gated by privacy/KMS
    prerequisites, and staged snapshots do not imply verification or submission
    eligibility.

    Individual and Joint contracts remain unchanged. D-06 Revision 8 adds an
    additive Corporate applicant registration variant to the existing auth
    endpoint; legacy Individual registration remains the default. The
    revision is implementation-backed and recorded for David/Emmanuel
    coordination before client adoption; it does not introduce a Corporate
    authentication role. Document upload, Mono provider calls/webhooks, staff
    review, final compliance decisions and investment eligibility/activation
    remain unavailable pending approved policy, operational dependencies and
    coordinated D-06 change control.

    Change control: no unilateral breaking changes; breaking changes require a
    coordinated version/change decision by David and Emmanuel. D-06 Revision 8
    is a non-breaking, additive contract amendment; generated-client operationId
    `registerInvestor` is retained for compatibility.
  x-status: PHASE-2D-PLUS-CORPORATE-O2-O4-OWNER-READS-SNAPSHOT-STAGING-D06-REV8
  x-d06-change-record:
    revision: 8
    date: 2026-10-22
    classification: additive-non-breaking
    coordination: pending-frontend-mobile-review-before-client-adoption
  contact:
    name: Starfetch Engineering (David — backend; Emmanuel — frontend/mobile)

servers:
  - url: /api/v1
    description: Version 1 of the Starfetch API (global prefix)

tags:
  - name: System
    description: Service availability and operational endpoints
  - name: Auth
    description: Phase 2B authentication & identity (client-neutral core)
  - name: Me
    description: Current authenticated user
  - name: Corporate
    description: Gated O2 creation, owner-scoped O3/O11 reads, versioned O4 amendments, discovery and snapshot staging; submission and approval are not exposed.

paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Service health check
      description: |
        Public availability/integrity check. Requires no authentication. The
        response deliberately excludes environment values, database details,
        credentials, and server internals.
      responses:
        "200":
          description: Service is up.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  status: ok
                  version: "0.0.1"
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/register:
    post:
      tags:
        - Auth
      operationId: registerInvestor
      summary: Register an Individual or Corporate applicant
      description: |
        D-06 Revision 8 extends the existing registration contract additively.
        All registrations atomically create a role-`INVESTOR` User and an
        EmailVerificationChallenge. An Individual registration also creates an
        InvestorProfile; a Corporate registration intentionally does not.
        Registration NEVER issues a session, access token or refresh credential
        and NEVER marks the email verified — the client proceeds to email
        verification. The legacy operationId `registerInvestor` is retained
        so generated clients are not renamed by this additive change.

        Request variants:
        - Omitted `registrationType` means `INDIVIDUAL` for existing clients;
          `firstName`, `lastName`, `email`, and `password` are required.
        - Explicit `registrationType: "INDIVIDUAL"` has the same required fields.
        - `registrationType: "CORPORATE"` requires `email` and `password`;
          `firstName` and `lastName` are optional, validated if supplied, and
          are not persisted to an InvestorProfile. Corporate applicants should
          omit them unless a coordinated client form requires them.
        No caller-selected authentication role is accepted. `confirmPassword`
        is frontend-only; other unknown fields (including `phone` and `role`)
        are rejected by the global validation pipeline.

        Duplicate policy: `email` is stored in display form; uniqueness is
        enforced on `normalizedEmail` (trim + lowercase). Duplicate
        registrations return the same safe `CONFLICT` error without
        distinguishing verified vs unverified existing accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; verification code sent via email provider.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                data:
                  userId: "8c1c6f42-6d3e-4a7d-9d4c-1a2b3c4d5e6f"
                  verificationId: "5a4b3c2d-1e2f-4a5b-9c8d-7e6f5a4b3c2d"
                  email: "u***@example.com"
                  emailVerified: false
                  nextAction: "VERIFY_EMAIL"
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/email/verify:
    post:
      tags:
        - Auth
      operationId: verifyEmail
      summary: Verify email ownership with the 6-digit code
      description: |
        Confirms email ownership. Codes are 6 numeric digits from a CSPRNG,
        live 10 minutes, allow 5 attempts, and are single-use; successful
        verification consumes the challenge and sets `users.emailVerifiedAt`
        atomically. No session is created — the client proceeds to login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResponse"
              example:
                data:
                  emailVerified: true
                  nextAction: "LOGIN"
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "400":
          description: |
            `EMAIL_VERIFICATION_INVALID` (wrong code) or
            `EMAIL_VERIFICATION_EXPIRED` (past 10-minute lifetime).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Unknown `verificationId` (`EMAIL_VERIFICATION_INVALID`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Code already consumed (`EMAIL_VERIFICATION_CONSUMED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Attempt cap reached (`EMAIL_VERIFICATION_ATTEMPTS_EXCEEDED`) or endpoint throttled (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/email/resend:
    post:
      tags:
        - Auth
      operationId: resendVerificationEmail
      summary: Request a fresh verification code
      description: |
        Keeps the same `verificationId` while rotating code/verifier/expiry —
        the previous code is immediately invalidated. Enforces a 60-second
        cooldown (`RESEND_COOLDOWN`, with `error.context.retryAfterSeconds`)
        and a 5-resends-per-hour window (`RESEND_LIMIT_EXCEEDED`).
        Never returns the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: New code issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendVerificationResponse"
              example:
                data:
                  verificationId: "5a4b3c2d-1e2f-4a5b-9c8d-7e6f5a4b3c2d"
                  email: "u***@example.com"
                  expiresInSeconds: 600
                  resendInSeconds: 60
        "404":
          description: Unknown `verificationId` (`EMAIL_VERIFICATION_INVALID`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already verified (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Cooldown / hourly limit (`RESEND_COOLDOWN`, `RESEND_LIMIT_EXCEEDED`) or throttled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Sign in with email + password
      description: |
        Email is normalized (trim + lowercase) for lookup. Unknown email and
        wrong password produce the IDENTICAL public error (`401
        INVALID_CREDENTIALS`, equalized verification timing). A verified
        account is required — otherwise `403 EMAIL_NOT_VERIFIED` with safe
        context (`verificationId`, masked email) and NO session.

        On success (browser clients): the refresh credential is set as an
        HttpOnly `Set-Cookie` (`sf_refresh`; `__Host-sf_refresh` where the
        host-prefixed name is valid) and a readable signed CSRF cookie
        (`sf_csrf`). The refresh credential NEVER appears in the JSON body.
        A Corporate applicant without an `InvestorProfile` can authenticate
        normally; its SafeUser `firstName` and `lastName` values are empty strings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; session established.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: |
                `sf_refresh=<credential>; HttpOnly; SameSite=Lax; Path=/` (+`Secure`
                outside local development) and `sf_csrf=<signed-token>;
                SameSite=Lax; Path=/` (readable for the double-submit header).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIs..."
                  expiresInSeconds: 900
                  user:
                    id: "8c1c6f42-6d3e-4a7d-9d4c-1a2b3c4d5e6f"
                    firstName: "David"
                    lastName: "Example"
                    email: "user@example.com"
                    emailVerified: true
                    role: "INVESTOR"
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "401":
          description: Identical error for unknown email and wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: We could not sign you in with those details.
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "403":
          description: Email ownership not yet verified (no session issued).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: EMAIL_NOT_VERIFIED
                  message: Please verify your email address before signing in.
                  context:
                    verificationId: "5a4b3c2d-1e2f-4a5b-9c8d-7e6f5a4b3c2d"
                    email: "u***@example.com"
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshSession
      summary: Rotate the refresh credential and obtain a new access token
      description: |
        Requires the HttpOnly refresh cookie **and** the readable CSRF cookie
        echoed in the `X-CSRF-Token` header (signed double-submit, bound to the
        session), plus Origin/Referer allowlist policy for browser clients.

        On success the refresh credential is ROTATED (previous credential is
        permanently unusable), the idle window slides forward, and a new CSRF
        token + access JWT are issued. Presenting an already-rotated/used/
        revoked credential triggers **reuse detection: the entire session is
        revoked** and every credential tied to it dies (sign-in required).
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
          example: "sf_refresh=<opaque>; sf_csrf=<sessionId>.<token>.<hmac>"
      responses:
        "200":
          description: Rotated; new access token issued (new cookies set).
          headers:
            Set-Cookie:
              description: Rotated `sf_refresh` + `sf_csrf` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: Missing/invalid/expired/reused credential or expired/idle/revoked session (`UNAUTHENTICATED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CSRF mismatch (`CSRF_VALIDATION_FAILED`) or untrusted browser origin (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Sign out, revoking the server-side session
      description: |
        Requires refresh + CSRF pair (same rules as refresh). Revokes the
        session server-side (`revokeReason = USER_LOGOUT`), revokes the current
        credential, and clears both cookies. Repeated logout is idempotent and
        returns the same success without leaking state.
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Logged out; cookies cleared.
          headers:
            Set-Cookie:
              description: Expiring `sf_refresh` and `sf_csrf` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "403":
          description: CSRF mismatch or untrusted origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /corporate-accounts/applications:
    post:
      tags: [Corporate]
      operationId: createCorporateApplicationO2
      summary: Create an authenticated Corporate DRAFT (O2)
      description: |
        The route is unavailable unless the explicit O2 switch, lawful-basis,
        privacy-notice and retention approvals, environment-specific KMS key,
        and dedicated versioned O2 HMAC keyring are all ready. The gate is
        disabled by default and fails closed with `503 FEATURE_UNAVAILABLE`.
        The authenticated, live-session INVESTOR must have verified email.
        Browser clients must send an allowlisted Origin or Referer and the
        session-bound signed double-submit CSRF cookie/header pair. Exactly the
        six request fields are accepted; actor, owner, status, submission,
        authority and approval fields are rejected.

        TIN is encrypted before persistence and never returned, logged or stored
        as plaintext. Exact same-user/key/payload retries replay the original
        receipt; same-user duplicate canonical content returns that user's
        existing receipt; cross-user content is neither searched nor disclosed
        and is not merged. No global RC uniqueness or applicant-visible
        cross-user duplicate check is performed. No submission, approval or
        investment permission is created.

        Rate limit: 5 requests/hour per authenticated user via the current
        process-local in-memory limiter. It is effective per backend instance
        only; horizontal production requires a shared/distributed RATE_LIMITER
        implementation or an explicitly single-instance deployment. This O2
        route currently has no separate IP-keyed limit.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/Idempotency-Key"
        - name: Cookie
          in: header
          required: true
          description: Contains `sf_csrf` in development/test or `__Host-sf_csrf` in staging/production.
          schema: { type: string }
        - name: Origin
          in: header
          required: false
          description: Browser Origin must match the configured allowlist; Referer is accepted as the existing fallback.
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorporateO2CreateRequest"
      responses:
        "201":
          description: Owner-bound Corporate DRAFT created or safely replayed.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateO2CreateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Missing, invalid, expired, or revoked session-bound access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Unverified email, non-investor, untrusted browser origin, or failed CSRF validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            FEATURE_UNAVAILABLE while the activation gate is closed, or safe
            SERVICE_UNAVAILABLE for missing HMAC/KMS crypto dependencies. Writes
            roll back on crypto failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                featureUnavailable:
                  value:
                    error: { code: FEATURE_UNAVAILABLE, message: Corporate registration is currently unavailable., requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d" }
                cryptoUnavailable:
                  value:
                    error: { code: SERVICE_UNAVAILABLE, message: Corporate registration is temporarily unavailable., requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d" }

  /corporate-accounts/{corporateAccountId}/onboarding:
    get:
      tags: [Corporate]
      operationId: getOwnCorporateOnboardingO3
      summary: Read the initiating applicant's Corporate application and details
      description: |
        The path identifier is specifically the `CorporateAccount.id`; it is
        distinct from the returned `applicationId`. The backend maps this
        account ID to a Corporate application owned by the authenticated,
        verified INVESTOR who initiated it, then rechecks that ownership on
        every request. Supplying an application ID in this path does not
        address the application. Missing, malformed, and non-owned IDs return
        the identical generic `404 NOT_FOUND`.

        Status is returned without lifecycle-state filtering for all six states.
        TIN is never returned in plaintext: it is `null` while the KMS/privacy
        activation gate is closed; when open it is a masked projection (values
        of 8 code points or fewer are fully masked; longer values reveal at
        most one quarter of the suffix, capped at four code points). Ciphertext,
        key metadata, fingerprints, actors and internal authorization records
        are excluded. This read grants no edit, submission, approval or
        investment permission. GET requires bearer/session auth and no CSRF.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
      responses:
        "200":
          description: Owner-scoped application status and approved masked details.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateOnboardingResponse" }
        "401":
          description: Missing, invalid, expired, or revoked session-bound access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Non-investor or unverified initiating applicant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Identical generic response for missing, malformed, or non-owned CorporateAccount IDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Masked TIN projection could not be safely produced because KMS/envelope decryption was unavailable; no plaintext or crypto metadata is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /corporate-accounts/{corporateAccountId}/onboarding/draft:
    patch:
      tags: [Corporate]
      operationId: updateOwnCorporateDraftO4
      summary: Amend the initiating applicant's Corporate DRAFT details (O4)
      description: |
        The path identifier is specifically a CorporateAccount UUID. Every
        request re-proves the verified INVESTOR's immutable initiating-user
        ownership; principals are not inferred or supported. Edits are allowed
        only in DRAFT or INFO_REQUESTED and update the single canonical details
        row. `If-Match` must be the current quoted positive details version;
        stale versions return 409 without changing details or history. Every
        successful patch appends an immutable versioned amendment snapshot in
        the same transaction. TIN is accepted only after the privacy/KMS gate
        passes and is encrypted before persistence; responses/history never
        contain plaintext or envelope metadata. No submission or approval is
        performed. Rate limit: 60 requests/hour per authenticated user using
        the process-local keyed limiter; it is per instance and resets on restart.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
        - $ref: "#/components/parameters/X-CSRF-Token"
        - name: If-Match
          in: header
          required: true
          description: Strong quoted details version, for example `"3"`.
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
        - name: Cookie
          in: header
          required: true
          description: Contains the session-bound CSRF cookie (`sf_csrf` locally or `__Host-sf_csrf` in secure environments).
          schema: { type: string }
        - name: Origin
          in: header
          required: false
          description: Browser Origin must match the configured allowlist; Referer is the existing fallback.
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorporateDetailsUpdateRequest" }
      responses:
        "200":
          description: Canonical details amended and immutable revision appended.
          headers:
            x-request-id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateDraftUpdateResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Missing, invalid, expired, or revoked session-bound access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Non-investor, unverified applicant, untrusted browser origin, or failed CSRF validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Identical generic response for missing, malformed, or non-owned CorporateAccount IDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Stale If-Match version or application state does not permit editing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: TIN crypto/privacy gate unavailable; the amendment transaction rolls back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /corporate-accounts/{corporateAccountId}/onboarding/verification-snapshot/freshness:
    get:
      tags: [Corporate]
      operationId: getOwnCorporateVerificationSnapshotFreshness
      summary: Assess the latest immutable verification snapshot's source freshness
      description: |
        Owner-scoped read of the newest staged snapshot generation. It compares
        the captured Corporate details version to the current canonical details
        version. A stale snapshot is retained unchanged; this endpoint neither
        creates evidence nor grants submission/approval eligibility.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
      responses:
        "200":
          description: Latest snapshot generation and freshness issues; no snapshot is a safe stale result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateSnapshotFreshnessResponse" }
        "401":
          description: Missing, invalid, expired, or revoked session-bound access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Non-investor or unverified initiating applicant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Identical generic response for missing, malformed, or non-owned CorporateAccount IDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /corporate-accounts/{corporateAccountId}/onboarding/verification-snapshot:
    post:
      tags: [Corporate]
      operationId: regenerateOwnCorporateVerificationSnapshot
      summary: Append or retrieve the current immutable verification snapshot generation
      description: |
        Owner-scoped, idempotent staging operation. Requires an exact approved
        and published ruleset version already bound to this application. A
        fresh generation is returned on replay; changed details append a new
        generation while stale generations remain immutable. This does not run
        a provider check, satisfy a requirement, submit the application, or
        create a compliance decision. Submission eligibility is always false.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
        - $ref: "#/components/parameters/X-CSRF-Token"
        - name: Cookie
          in: header
          required: true
          description: Contains the session-bound CSRF cookie (`sf_csrf` locally or `__Host-sf_csrf` in secure environments).
          schema: { type: string }
        - name: Origin
          in: header
          required: false
          description: Browser Origin must match the configured allowlist; Referer is the existing fallback.
          schema: { type: string, format: uri }
      responses:
        "200":
          description: Current immutable generation created or safely replayed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateVerificationSnapshotResponse" }
        "401":
          description: Missing, invalid, expired, or revoked session-bound access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Non-investor, unverified applicant, untrusted browser origin, or failed CSRF validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Identical generic response for missing, malformed, or non-owned CorporateAccount IDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: No exact approved/published ruleset binding or the application is not editable for staging.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /corporate-accounts/{corporateAccountId}/onboarding/history:
    get:
      tags: [Corporate]
      operationId: getOwnCorporateOnboardingHistoryO11
      summary: Read permitted history for the initiating applicant's Corporate application
      description: |
        `corporateAccountId` is a CorporateAccount UUID, not an application UUID.
        Requires the authenticated, verified initiating INVESTOR and rechecks
        ownership on every request. Missing, malformed, and non-owned IDs share
        the same generic 404. The read returns only permitted application
        lifecycle-history fields; actor IDs, staff/compliance authorization,
        evidence, and internal audit records are not exposed. Read access grants
        no mutation or approval authority. GET requires no CSRF token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
      responses:
        "200":
          description: Owner-scoped permitted history, ordered oldest first.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateHistoryResponse" }
        "401":
          description: Missing, invalid, expired, or revoked session-bound access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Non-investor or unverified initiating applicant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Identical generic response for missing, malformed, or non-owned CorporateAccount IDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          $ref: "#/components/responses/InternalError"

  /me/corporate-accounts:
    get:
      tags: [Corporate]
      operationId: listOwnCorporateApplications
      summary: Discover Corporate applications initiated by the current investor
      description: |
        Returns only applications whose immutable initiatingUserId matches the
        authenticated, verified INVESTOR. No principal access is inferred; rows
        are not merged across users. Identifiers are explicitly typed and the
        list contains no business details or TIN.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner-scoped Corporate application list (empty is normal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateApplicationDiscoveryResponse" }
        "401":
          description: Missing, invalid, expired, or revoked session-bound access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Non-investor or unverified applicant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me:
    get:
      tags:
        - Me
      operationId: getCurrentUser
      summary: Current authenticated user
      description: |
        Requires `Authorization: Bearer <access-token>`. Returns the approved
        safe projection only — never password hashes, `normalizedEmail`,
        session/token hashes, verification verifiers or internal secrets. For
        a Corporate applicant registered without an `InvestorProfile`,
        `firstName` and `lastName` are empty strings; this is a normal safe-user
        projection and does not invalidate authentication or Corporate O2 access.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
              example:
                data:
                  id: "8c1c6f42-6d3e-4a7d-9d4c-1a2b3c4d5e6f"
                  firstName: "David"
                  lastName: "Example"
                  email: "user@example.com"
                  emailVerified: true
                  role: "INVESTOR"
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "401":
          description: Missing/invalid/expired token or malformed claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/profile:
    get:
      tags:
        - Me
      operationId: getOwnInvestorProfile
      summary: Current investor's profile (INVESTOR role only)
      description: |
        Requires `Authorization: Bearer <access-token>` **and** role
        `INVESTOR` (enforced server-side via RolesGuard — frontend route
        guards are UX only). Returns ONLY the authenticated principal's own
        profile — ownership is derived from the validated token, never from
        request parameters. `email` is read-only, sourced from the User
        record. The projection NEVER includes password hashes,
        `normalizedEmail`, session/token data, verification verifiers, or any
        internal field. Corporate applicants registered without an
        `InvestorProfile` remain authenticated but receive `404 NOT_FOUND`
        from this profile-specific route; it does not create an Individual
        profile implicitly.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated investor's profile.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfileResponse"
              example:
                data:
                  firstName: "David"
                  lastName: "Example"
                  email: "user@example.com"
                  phone: null
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "401":
          description: Missing/invalid/expired token or malformed claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated principal is not an INVESTOR (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have access to this resource.
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "404":
          description: Profile record absent for the principal (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Me
      operationId: updateOwnInvestorProfile
      summary: Update the current investor's profile (INVESTOR role only)
      description: |
        Requires `Authorization: Bearer <access-token>` **and** role
        `INVESTOR`. Ownership is ALWAYS the authenticated principal — **no
        `userId` is accepted from body or query**; one investor can never
        target another's profile here.

        Updatable fields (all optional, at least one required): `firstName`,
        `lastName` (trimmed, 1–60 chars) and optional `phone` (pragmatic
        local/international format; explicit `null` clears it). **`email` is
        NOT editable through this endpoint** — it is not part of the schema
        and is rejected as an unknown field. No other profile/KYC fields
        exist on this surface. A Corporate applicant without an
        `InvestorProfile` receives `404 NOT_FOUND`; this update route does not
        create an Individual profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated; returns the updated projection.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfileResponse"
        "400":
          description: |
            Validation failure (`VALIDATION_FAILED`): invalid/empty text,
            bad phone format, empty body, `email`/unknown/unapproved fields,
            or a `userId` targeting attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing/invalid/expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated principal is not an INVESTOR (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Profile record absent for the principal (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/portfolio:
    get:
      tags:
        - Me
      operationId: getOwnPortfolio
      summary: Current investor's portfolio (INVESTOR role only)
      description: |
        Dashboard read for the authenticated investor's portfolio.
        `userId` is NEVER accepted from query/body/path — ownership comes
        exclusively from the validated bearer token.

        **Empty state is normal and successful**: a new investor has no
        portfolio/holding rows and receives `totalValueMinor: 0`,
        `holdingCount: 0`, `holdings: []`. The backend NEVER seeds demo or
        fake records to populate the dashboard.

        Money semantics: all amounts are **minor units** (kobo for NGN).
        `totalValueMinor` aggregates STORED holding values only — there is NO
        market valuation logic, and no rates, yields, fees, performance or
        gains are computed or returned. `totalReturnMinor` is always `null`
        until an approved return/cost-basis calculation exists.

        `meta` additionally carries `asOf` (ISO timestamp of this snapshot)
        alongside the standard `requestId`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Portfolio snapshot (empty state for new investors).
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
              example:
                data:
                  currency: "NGN"
                  totalValueMinor: 0
                  holdingCount: 0
                  totalReturnMinor: null
                  holdings: []
                meta:
                  asOf: "2026-11-03T14:40:00.000Z"
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "401":
          description: Missing/invalid/expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated principal is not an INVESTOR (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/transactions:
    get:
      tags:
        - Me
      operationId: listOwnTransactions
      summary: Current investor's transaction list (INVESTOR role only)
      description: |
        Paginated ledger read for the authenticated investor. `userId` is
        NEVER accepted — unknown query fields are rejected
        (`400 VALIDATION_FAILED`), and ownership comes exclusively from the
        bearer token. New investors receive an empty `data` array with
        `total: 0`; rows are real records only (never demo data).

        Ordering: newest first (`occurredAt` descending). Money semantics as
        per `/me/portfolio`: minor units, currency attributes on each row;
        `amountMinor` is signed (credit positive / debit negative).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1, example: 1 }
          description: 1-based page number.
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20, example: 5 }
          description: Page size (1–100; dashboard baseline uses 5).
      responses:
        "200":
          description: Page of transactions (may be legitimately empty).
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPageResponse"
              example:
                data: []
                meta:
                  page: 1
                  pageSize: 5
                  total: 0
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "400":
          description: Invalid pagination or unknown query field (e.g. a `userId` targeting attempt).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing/invalid/expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated principal is not an INVESTOR (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived HS256 access JWT (15 minutes). Claims are minimal:
        `sub` (user id), `role`, `sid` (session id), `iat`, `exp`. Tokens never
        carry KYC/phone/financial/portfolio/document data.

  parameters:
    X-CSRF-Token:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        Signed double-submit CSRF token — must equal the readable `sf_csrf`
        cookie value (`<sessionId>.<token>.<HMAC-SHA-256>`) and is bound to the
        authenticated session. Rotated on every successful refresh.
      schema:
        type: string
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque client-generated key; 1–255 characters. Reuse only for retries of the same logical request and body.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    CorporateAccountId:
      name: corporateAccountId
      in: path
      required: true
      description: UUID of the CorporateAccount resource; distinct from the Corporate application ID.
      schema:
        type: string
        format: uuid

  headers:
    X-Request-Id:
      description: |
        Correlation identifier for the request. A client may supply a safe value
        (`x-request-id` request header, 8–100 chars of `[A-Za-z0-9._-]`); it is
        echoed back. Otherwise the server generates one (UUID). Present on every
        response, including errors — also for `/` and unknown paths.
      schema:
        type: string
        example: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
          description: Server-set correlation ID (matches the x-request-id header).
      required:
        - requestId

    HealthData:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Informational API version string.
      required:
        - status
        - version

    HealthResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta

    RegisterRequest:
      description: |
        D-06 Revision 8 registration variants. Omitted registrationType is the
        backward-compatible Individual request; Corporate is an explicit
        alternative and never selects an authentication role.
      oneOf:
        - $ref: "#/components/schemas/RegisterIndividualRequestLegacy"
        - $ref: "#/components/schemas/RegisterIndividualRequest"
        - $ref: "#/components/schemas/RegisterCorporateRequest"

    RegisterIndividualRequestLegacy:
      type: object
      additionalProperties: false
      description: Legacy Individual request; omission of registrationType defaults to INDIVIDUAL.
      properties:
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 320 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Passphrase-friendly — NO composition rules (no required symbols/case/digits).
      required: [firstName, lastName, email, password]

    RegisterIndividualRequest:
      type: object
      additionalProperties: false
      description: Explicit Individual request; persists an InvestorProfile.
      properties:
        registrationType:
          type: string
          enum: [INDIVIDUAL]
          description: Explicitly select the legacy Individual registration path.
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 320 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Passphrase-friendly — NO composition rules (no required symbols/case/digits).
      required: [registrationType, firstName, lastName, email, password]

    RegisterCorporateRequest:
      type: object
      additionalProperties: false
      description: Corporate applicant registration; does not create an InvestorProfile.
      properties:
        registrationType:
          type: string
          enum: [CORPORATE]
          description: Selects the Corporate applicant path, not a UserRole.
        firstName:
          type: string
          minLength: 1
          maxLength: 60
          description: Optional; validated if supplied and not persisted to an InvestorProfile.
        lastName:
          type: string
          minLength: 1
          maxLength: 60
          description: Optional; validated if supplied and not persisted to an InvestorProfile.
        email: { type: string, format: email, maxLength: 320 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Passphrase-friendly — NO composition rules (no required symbols/case/digits).
      required: [registrationType, email, password]

    RegisterResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            userId: { type: string, format: uuid }
            verificationId: { type: string, format: uuid }
            email:
              type: string
              description: Masked email (e.g. `u***@example.com`).
            emailVerified: { type: boolean, enum: [false] }
            nextAction: { type: string, enum: [VERIFY_EMAIL] }
          required: [userId, verificationId, email, emailVerified, nextAction]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      properties:
        verificationId: { type: string, format: uuid }
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required: [verificationId, code]

    VerifyEmailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            emailVerified: { type: boolean, enum: [true] }
            nextAction: { type: string, enum: [LOGIN] }
          required: [emailVerified, nextAction]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    ResendVerificationRequest:
      type: object
      additionalProperties: false
      properties:
        verificationId: { type: string, format: uuid }
      required: [verificationId]

    ResendVerificationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            verificationId: { type: string, format: uuid }
            email: { type: string, description: Masked email. }
            expiresInSeconds: { type: integer, example: 600 }
            resendInSeconds: { type: integer, example: 60 }
          required: [verificationId, email, expiresInSeconds, resendInSeconds]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128 }
      required: [email, password]

    SafeUser:
      type: object
      description: |
        Public projection — never includes hashes or normalizedEmail. For a
        Corporate applicant account without an InvestorProfile, firstName and
        lastName are empty strings; the user remains authenticated normally.
      properties:
        id: { type: string, format: uuid }
        firstName:
          type: string
          description: Empty string when the account has no InvestorProfile (Corporate registration).
        lastName:
          type: string
          description: Empty string when the account has no InvestorProfile (Corporate registration).
        email: { type: string }
        emailVerified: { type: boolean }
        role: { type: string, enum: [INVESTOR, STAFF, ADMIN] }
      required: [id, firstName, lastName, email, emailVerified, role]

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string, description: HS256 JWT, 15-minute TTL. }
            expiresInSeconds: { type: integer, example: 900 }
            user:
              $ref: "#/components/schemas/SafeUser"
          required: [accessToken, expiresInSeconds, user]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    RefreshResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            expiresInSeconds: { type: integer, example: 900 }
          required: [accessToken, expiresInSeconds]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    LogoutResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            loggedOut: { type: boolean, enum: [true] }
          required: [loggedOut]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    MeResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SafeUser"
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    InvestorProfileData:
      type: object
      description: |
        Approved safe investor-profile projection (Phase 2C). `email` is
        read-only, owned by the User record. NEVER includes passwordHash,
        normalizedEmail, session/token data, or any internal field.
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email, readOnly: true }
        phone:
          type: string
          nullable: true
          description: Optional; `null` when unset. Explicit `null` on PUT clears it.
      required: [firstName, lastName, email, phone]

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; at least one required. Unknown fields —
        explicitly including `email` and any `userId`/targeting field — are
        rejected (`VALIDATION_FAILED`).
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed server-side.
        lastName:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed server-side.
        phone:
          type: string
          nullable: true
          pattern: "^\\+?[0-9][0-9()\\-\\s]{5,18}[0-9]$"
          description: Pragmatic local/international format; explicit `null` clears the value.

    InvestorProfileResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InvestorProfileData"
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    HoldingItem:
      type: object
      description: Stored holding row (minor units; no valuation logic applied).
      properties:
        id: { type: string, format: uuid }
        instrumentLabel: { type: string }
        quantity:
          type: string
          nullable: true
          description: Decimal quantity serialized as a string; null when not applicable.
        valueMinor: { type: integer, format: int64 }
        currency: { type: string, example: "NGN" }
        asOf: { type: string, format: date-time }
        isDemo:
          type: boolean
          enum: [false]
          description: Always false — demo/fake records do not exist in the platform.
      required: [id, instrumentLabel, quantity, valueMinor, currency, asOf, isDemo]

    PortfolioData:
      type: object
      properties:
        currency: { type: string, enum: ["NGN"] }
        totalValueMinor:
          type: integer
          format: int64
          description: Sum of STORED holding values only (minor units).
        holdingCount: { type: integer }
        totalReturnMinor:
          type: integer
          format: int64
          nullable: true
          description: Always null until an approved return calculation exists.
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/HoldingItem"
      required: [currency, totalValueMinor, holdingCount, totalReturnMinor, holdings]

    PortfolioResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PortfolioData"
        meta:
          type: object
          properties:
            requestId: { type: string }
            asOf:
              type: string
              format: date-time
              description: Snapshot timestamp.
          required: [requestId, asOf]
      required: [data, meta]

    TransactionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: Business vocabulary pinned by a later approved contract. }
        status: { type: string }
        amountMinor:
          type: integer
          format: int64
          description: Signed minor units (credit positive / debit negative).
        currency: { type: string, example: "NGN" }
        description: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
      required: [id, type, status, amountMinor, currency, description, occurredAt]

    TransactionPageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TransactionItem"
        meta:
          type: object
          properties:
            requestId: { type: string }
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
          required: [requestId, page, pageSize, total]
      required: [data, meta]

    CorporateO2CreateRequest:
      type: object
      additionalProperties: false
      description: Exactly six Corporate Business Information fields; extra identity, ownership, status, authority or approval fields are rejected.
      properties:
        institutionName: { type: string, minLength: 1, maxLength: 255 }
        dateOfIncorporation:
          type: string
          format: date
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        rcNumber: { type: string, minLength: 1, maxLength: 255 }
        taxIdentificationNumber:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Encrypted before persistence; never echoed, logged or returned in plaintext.
        businessPhoneNumber: { type: string, minLength: 1, maxLength: 64 }
        businessEmail: { type: string, format: email, maxLength: 254, description: Normalized to lowercase. }
      required: [institutionName, dateOfIncorporation, rcNumber, taxIdentificationNumber, businessPhoneNumber, businessEmail]

    CorporateO2CreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            corporateAccountId: { type: string, format: uuid }
            applicationId: { type: string, format: uuid }
            applicationStatus: { type: string, enum: [DRAFT] }
            detailsVersion: { type: integer, enum: [1] }
          required: [corporateAccountId, applicationId, applicationStatus, detailsVersion]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    CorporateApplicationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, IN_REVIEW, INFO_REQUESTED, APPROVED, REJECTED]

    CorporateDetailsRead:
      type: object
      description: Approved O2 details projection only. TIN masking is proportion-limited; TIN is null while the KMS/privacy activation gate is closed.
      properties:
        institutionName: { type: string }
        dateOfIncorporation: { type: string, format: date }
        rcNumber: { type: string }
        businessPhoneNumber: { type: string }
        businessEmail: { type: string, format: email }
        taxIdentificationNumberMasked: { type: string, nullable: true, description: No plaintext. Values of 8 code points or fewer are fully masked; longer values reveal at most 25% of a suffix, capped at four code points. }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [institutionName, dateOfIncorporation, rcNumber, businessPhoneNumber, businessEmail, taxIdentificationNumberMasked, version, createdAt, updatedAt]

    CorporateOnboardingResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            corporateAccountId: { type: string, format: uuid }
            applicationId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/CorporateApplicationStatus" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            details: { $ref: "#/components/schemas/CorporateDetailsRead" }
          required: [corporateAccountId, applicationId, status, createdAt, updatedAt, details]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    CorporateDetailsUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Partial patch over the six O2 Business Information fields with the same O2 structural limits. TIN is write-only and encrypted.
      properties:
        institutionName: { type: string, minLength: 1, maxLength: 255 }
        dateOfIncorporation: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        rcNumber: { type: string, minLength: 1, maxLength: 255 }
        businessPhoneNumber: { type: string, minLength: 1, maxLength: 64 }
        businessEmail: { type: string, format: email, minLength: 1, maxLength: 254 }
        taxIdentificationNumber: { type: string, minLength: 1, maxLength: 256, writeOnly: true, description: Accepted only when privacy/KMS prerequisites are active; never echoed or logged. }

    CorporateDraftUpdateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            applicationId: { type: string, format: uuid }
            corporateAccountId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/CorporateApplicationStatus" }
            details: { $ref: "#/components/schemas/CorporateDetailsRead" }
          required: [applicationId, corporateAccountId, status, details]
        meta: { $ref: "#/components/schemas/Meta" }
      required: [data, meta]

    CorporateApplicationDiscoveryItem:
      type: object
      properties:
        corporateAccountId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/CorporateApplicationStatus" }
        detailsVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        accessVia: { type: string, enum: [INITIATING_APPLICANT] }
      required: [corporateAccountId, applicationId, status, detailsVersion, createdAt, updatedAt, accessVia]

    CorporateApplicationDiscoveryResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CorporateApplicationDiscoveryItem" }
        meta: { $ref: "#/components/schemas/Meta" }
      required: [data, meta]

    CorporateSnapshotFreshnessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            applicationId: { type: string, format: uuid }
            snapshotId: { type: string, format: uuid, nullable: true }
            generation: { type: integer, minimum: 1, nullable: true }
            isFresh: { type: boolean }
            issues:
              type: array
              items:
                type: string
                enum: [SNAPSHOT_MISSING, ACCOUNT_KIND_CHANGED, CORPORATE_DETAILS_VERSION_CHANGED, JOINT_MEMBERSHIP_VERSION_CHANGED]
          required: [applicationId, snapshotId, generation, isFresh, issues]
        meta: { $ref: "#/components/schemas/Meta" }
      required: [data, meta]

    CorporateVerificationSnapshotTier:
      type: object
      properties:
        requirementCount: { type: integer, minimum: 0 }
        pendingCount: { type: integer, minimum: 0 }
        unresolvedCount: { type: integer, minimum: 0 }
        state: { type: string, enum: [NOT_ASSESSED, BLOCKED, INCOMPLETE] }
      required: [requirementCount, pendingCount, unresolvedCount, state]

    CorporateVerificationSnapshotResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            snapshotId: { type: string, format: uuid }
            generation: { type: integer, minimum: 1 }
            applicationId: { type: string, format: uuid }
            accountKind: { type: string, enum: [CORPORATE] }
            rulesetVersionId: { type: string, format: uuid }
            bindingId: { type: string, format: uuid }
            subjectCount: { type: integer, minimum: 0 }
            resolvedSubjectCount: { type: integer, minimum: 0 }
            unresolvedSubjectCount: { type: integer, minimum: 0 }
            requirementCount: { type: integer, minimum: 0 }
            pendingRequirementCount: { type: integer, minimum: 0 }
            unresolvedRequirementCount: { type: integer, minimum: 0 }
            tiers:
              type: object
              additionalProperties: { $ref: "#/components/schemas/CorporateVerificationSnapshotTier" }
            submissionEligible: { type: boolean, enum: [false] }
            idempotentReplay: { type: boolean }
          required: [snapshotId, generation, applicationId, accountKind, rulesetVersionId, bindingId, subjectCount, resolvedSubjectCount, unresolvedSubjectCount, requirementCount, pendingRequirementCount, unresolvedRequirementCount, tiers, submissionEligible, idempotentReplay]
        meta: { $ref: "#/components/schemas/Meta" }
      required: [data, meta]

    CorporateDetailsAmendment:
      type: object
      description: Safe immutable amendment metadata. No snapshots or actor identifiers are exposed.
      properties:
        version: { type: integer, minimum: 2 }
        changedFieldNames:
          type: array
          items: { type: string, enum: [institutionName, dateOfIncorporation, rcNumber, businessPhoneNumber, businessEmail, taxIdentificationNumber] }
        changedAt: { type: string, format: date-time }
      required: [version, changedFieldNames, changedAt]

    CorporateHistoryItem:
      type: object
      description: Permitted application lifecycle history only; actor and internal authorization fields are intentionally absent.
      properties:
        id: { type: string, format: uuid }
        event: { type: string, enum: [CREATED] }
        fromStatus:
          type: string
          nullable: true
          enum: [DRAFT, SUBMITTED, IN_REVIEW, INFO_REQUESTED, APPROVED, REJECTED]
        toStatus: { $ref: "#/components/schemas/CorporateApplicationStatus" }
        createdAt: { type: string, format: date-time }
      required: [id, event, fromStatus, toStatus, createdAt]

    CorporateHistoryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            corporateAccountId: { type: string, format: uuid }
            applicationId: { type: string, format: uuid }
            history:
              type: array
              items: { $ref: "#/components/schemas/CorporateHistoryItem" }
            detailsAmendments:
              type: array
              description: Safe immutable amendment metadata only; before/after values, TIN ciphertext, and actor IDs are omitted.
              items: { $ref: "#/components/schemas/CorporateDetailsAmendment" }
          required: [corporateAccountId, applicationId, history, detailsAmendments]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    Error:
      type: object
      description: |
        Stable error envelope. `message` is always safe for clients; internals
        are never exposed.
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Per-field validation details (present for VALIDATION_FAILED).
        context:
          type: object
          description: |
            Safe, client-presentable extras (e.g. EMAIL_NOT_VERIFIED carries
            `{ verificationId, email }` (masked); 429 classes may carry
            `{ retryAfterSeconds }`). Never internals.
        requestId:
          type: string
      required:
        - code
        - message
        - requestId

    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
        - error

    ErrorCode:
      type: string
      description: |
        Implemented error-code vocabulary, including Corporate O2/O3 errors.
        `FEATURE_UNAVAILABLE` is the fail-closed O2 activation-gate response;
        `SERVICE_UNAVAILABLE` is a safe crypto/provider failure response.
      enum:
        # Foundation
        - VALIDATION_FAILED                 # 400 — request data failed validation; `fields` populated
        - UNAUTHENTICATED                   # 401 — missing/invalid/expired access or session credential
        - FORBIDDEN                         # 403 — policy failure (e.g. untrusted browser origin)
        - NOT_FOUND                         # 404 — resource absent
        - CONFLICT                          # 409 — e.g. duplicate account, already verified
        - FILE_TOO_LARGE                    # 413 — reserved for later document phases
        - UNSUPPORTED_FILE_TYPE             # 415 — reserved for later document phases
        - RATE_LIMITED                      # 429 — endpoint throttled
        - INTERNAL_ERROR                    # 500 — unexpected; never leaks internals
        - FEATURE_UNAVAILABLE               # 503 — Corporate O2 activation gate is closed
        - SERVICE_UNAVAILABLE               # 503 — safe cryptographic/provider dependency failure
        # Authentication (Phase 2B)
        - INVALID_CREDENTIALS               # 401 — identical error for unknown email/wrong password
        - EMAIL_NOT_VERIFIED                # 403 — verification required before login
        - EMAIL_VERIFICATION_INVALID        # 400/404 — wrong code or unknown verificationId
        - EMAIL_VERIFICATION_EXPIRED        # 400 — past the 10-minute lifetime
        - EMAIL_VERIFICATION_CONSUMED       # 409 — code already used (single-use)
        - EMAIL_VERIFICATION_ATTEMPTS_EXCEEDED # 429 — 5-attempt cap reached; code killed
        - RESEND_COOLDOWN                   # 429 — 60-second resend cooldown active
        - RESEND_LIMIT_EXCEEDED             # 429 — 5 resends per hour limit
        - CSRF_VALIDATION_FAILED            # 403 — missing/mismatched signed CSRF pair
        - SESSION_INVALID                   # reserved — session policy failure
        - EMAIL_DELIVERY_FAILED             # 500 — verification email transport failed

  responses:
    InternalError:
      description: Unexpected server error (safe envelope).
      headers:
        x-request-id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
              requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: VALIDATION_FAILED
              message: One or more fields require attention.
              fields:
                password: password must be at least 8 characters
              requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

    ConflictError:
      description: Safe conflict (e.g. duplicate account — no account-state leakage).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: CONFLICT
              message: An account with this email address already exists.
              requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

    RateLimitError:
      description: Throttled (safe envelope with retry hint).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests — please try again later.
              context:
                retryAfterSeconds: 540
              requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

x-conventions:
  success-envelope:
    description: |
      Successful responses use `{ "data": ..., "meta": { "requestId": ... } }`.
      Additional `meta` members are introduced by later endpoint contracts.
  request-id:
    description: |
      Every request has a correlation ID: client-supplied safe `x-request-id`
      values are honoured, otherwise one is generated. Returned in the
      `x-request-id` response header, `meta.requestId`, and `error.requestId`.
  authentication:
    description: |
      IMPLEMENTED (Phase 2B) per the approved architectural direction:
      short-lived (15 min) HS256 JWT access credential (`sub`, `role`, `sid`)
      + opaque 384-bit refresh credential (7-day absolute / 24-hour idle),
      server-side sessions with single-use ROTATION and reuse detection
      (presenting a rotated credential revokes the session).
      Web transport: HttpOnly refresh cookie + readable signed session-bound
      CSRF cookie, `X-CSRF-Token` double-submit, Origin/Referer policy, CORS
      allowlist (credentials enabled only with an explicit allowlist; never "*").
      Core auth/session services are client-neutral so the future mobile app
      uses the same model with platform-secure storage instead of cookies.
  authorization:
    description: |
      Role authorization is enforced server-side (Phase 2C: `@Roles()` +
      RolesGuard evaluating the `role` claim AFTER bearer-token validation).
      Frontend route guards remain UX only. Resource ownership is always
      derived from the authenticated principal — request-supplied user
      identifiers are never honoured.
  money-and-empty-state:
    description: |
      Phase 2D dashboard contract: all monetary integers are MINOR units
      (kobo for NGN). A new investor has no portfolio/holding/transaction
      rows — that ABSENCE is a normal successful empty dashboard state
      (`totalValueMinor: 0`, `holdings: []`, `data: []`, `total: 0`), NOT an
      error, and the backend NEVER fabricates demo records. No market
      valuation, rates, yields, fees, performance, returns or cost-basis
      logic exists on this contract; `totalReturnMinor` stays `null`.
  throttling:
    description: |
      Authentication-sensitive routes use server-side fixed-window throttling.
      Corporate O2 additionally uses a post-authentication limit of 5 create
      requests/hour/user. The current RATE_LIMITER is in-memory and process-local;
      limits fragment across multiple backend instances and reset on process
      restart. Until a shared/distributed adapter is implemented, production
      must keep O2 on one instance or disable horizontal scaling for this route.
      No separate O2 IP-keyed limit is currently configured; no global RC or
      cross-user duplicate lookup is performed.
  open-decisions:
    description: |
      D-08 (application status/state-transition map) — OPEN.
      D-09 (one-active-application semantics, incl. staff-list selection) — OPEN.
      Document categories/review outcomes/lifecycle vocabulary — TBD
      (BUSINESS / COMPLIANCE + CONTRACT APPROVAL REQUIRED).
      No contract here may presume those outcomes.
