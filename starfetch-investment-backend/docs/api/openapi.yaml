openapi: 3.0.3

info:
  title: Starfetch Investment Limited — Platform API
  version: 0.4.0
  description: |
    Canonical API contract for the Starfetch platform (one API serving the public
    website, investor web portal, staff/admin portal, and the future Android/iOS
    React Native clients).

    **Pinned-source scope:** this contract source is the repository copy whose
    metadata identifies version 0.4.0. Additive Corporate registration,
    account-context and saved Corporate Profile contract additions are recorded
    below for backend implementation. The retained 0.4.0 value is provenance,
    not a claim that it is the latest canonical published release; release
    lineage must be reconciled with maintainers before publication. Contracts
    cover health, Individual and Corporate registration, email verification,
    login/refresh/logout, `/me`, Individual profile/dashboard reads, and the
    owner-scoped Corporate Profile APIs. **A new investor with no
    portfolio/holding/transaction rows is a NORMAL state** — these reads return
    a real, successful empty dashboard; the backend NEVER seeds demo or fake
    financial records.

    Existing Corporate O2/O3/O4/O11 remain separate and unchanged. Corporate
    Profile additions persist saved applicant form data only; they do not add
    submission, review, verification, approval, investment eligibility, or
    funding semantics. The pinned frontend Corporate Profile page still sends
    no GET/PATCH requests, so these API contracts do not make the untouched UI
    persistent. Its login selector also sends no account type; the backend
    cannot enforce that unsent choice, but it enforces server-derived resource
    ownership and account boundaries. Other business surfaces remain gated by
    their approved implementation phases. Open decisions D-08 / D-09 and document vocabulary remain
    OPEN and are not presumed anywhere in this document.

    Change control: no unilateral breaking changes; breaking changes require a
    coordinated version/change decision by David and Emmanuel.
  x-status: ADDITIVE-CORPORATE-PROFILE-AND-ACCOUNT-CONTEXT-CONTRACT; RELEASE-LINEAGE-RECONCILIATION-REQUIRED
  x-pinned-source-version: "0.4.0"
  x-latest-canonical-release-asserted: false
  contact:
    name: Starfetch Engineering (David — backend; Emmanuel — frontend/mobile)

servers:
  - url: /api/v1
    description: Version 1 of the Starfetch API (global prefix)

tags:
  - name: System
    description: Service availability and operational endpoints
  - name: Public Market Data
    description: Public, read-only, unauthenticated delayed NGX market snapshot sourced from NGN Market (disabled by default)
  - name: Auth
    description: Phase 2B authentication & identity (client-neutral core)
  - name: Me
    description: Current authenticated user
  - name: Corporate Profile
    description: Owner-scoped four-section Corporate saved-form persistence; not submission or KYB approval
  - name: Corporate KYC Documents
    description: Section 5 — exactly three mandatory Corporate documents (Certificate of Incorporation, MEMART, TIN Certificate), owner view grants and applicant submission (DRAFT → SUBMITTED only)

paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Service health check
      description: |
        Public availability/integrity check. Requires no authentication. The
        response deliberately excludes environment values, database details,
        credentials, and server internals.
      responses:
        "200":
          description: Service is up.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  status: ok
                  version: "0.0.1"
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "500":
          $ref: "#/components/responses/InternalError"

  /public/market-snapshot:
    get:
      tags:
        - Public Market Data
      operationId: getPublicMarketSnapshot
      summary: Delayed NGX market snapshot for the public website (no login)
      security: []
      description: |
        Read-only, unauthenticated snapshot of the 14 homepage NGX equities and,
        where NGN Market supplies verifiable values, NGX summary indicators.
        Data is **delayed** (never "live"/"real-time"): NGN Market refreshes
        prices about every 20 minutes during NGX trading hours and serves the
        latest close outside them. Starfetch serves from a shared cache that is
        refreshed at most every 30 minutes in the weekday 09:00–16:30 WAT window
        and every 4 hours otherwise.

        - `equities[].quoteTimestamp` is the provider quote time; `cache.refreshedAt`
          is when Starfetch last fetched from the provider. They are different.
        - All 14 configured symbols are always returned in homepage order. A symbol
          missing from or invalid in the provider response has `available: false`
          and null price/percent/timestamp. Values are never estimated.
        - Each equity's quote timestamp must be a strict ISO-8601 instant (explicit
          `Z`/offset, real calendar date) that is not later than the server clock
          (zero tolerance). Each equity is served only while its own quote is at
          most 7 days old, checked when fetched and again on every response;
          otherwise it is `available: false` with `unavailableReason: QUOTE_EXPIRED`.
          This is independent of cache freshness (`cache.*`). `quoteAgeSeconds`
          (additive field) is the quote's age at `generatedAt`. Weekend/holiday
          quotes under 7 days old remain available and are simply older; no
          trading calendar is assumed.
        - New `unavailableReason` values may be added; clients must treat any
          unknown value as a generic "unavailable".
        - `status: stale` / `cache.isStale: true` means the cache missed its refresh
          (refresh in progress, failed or paused by budget/cooldown). Clients must
          label such data as delayed/stale.
        - `marketSummary` is null unless the provider supplied it. It is never
          computed from equities. Market-capitalisation units are as supplied by the
          provider and must be verified before display.
        - Attribution to NGN Market is required on any public display.

        Disabled by default; returns 503 `FEATURE_UNAVAILABLE` until explicitly
        enabled and approved. Errors are `Cache-Control: no-store`; successes are
        `public, max-age=N, s-maxage=N` with N ≤ 60, reduced so that no shared
        cache can serve a quote past its 7-day limit (`no-store` if N would be 0).
        A request that triggers a provider refresh completes within an overall
        6 s server-side deadline (plus at most 0.5 s lock release). Rate-limited
        per IP (120/minute).
      responses:
        "200":
          description: Snapshot served from the shared cache (fresh or explicitly labelled stale).
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
            Cache-Control:
              description: "`public, max-age=N, s-maxage=N` (N ≤ 60, never beyond the earliest quote expiry), or `no-store`."
              schema: { type: string, example: "public, max-age=60, s-maxage=60" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMarketSnapshotResponse"
              example:
                data:
                  status: ok
                  provider:
                    name: NGN Market
                    url: https://ngnmarket.com
                    attribution: Market data provided by NGN Market (ngnmarket.com).
                  dataType: delayed
                  delayNotice: Delayed data. NGN Market refreshes prices approximately every 20 minutes during NGX trading hours; outside trading hours prices reflect the latest available close. Starfetch caches provider data and refreshes it periodically. Not investment advice.
                  cache:
                    refreshedAt: "2026-10-22T10:00:00.000Z"
                    ageSeconds: 300
                    refreshIntervalSeconds: 1800
                    nextRefreshDueAt: "2026-10-22T10:30:00.000Z"
                    isStale: false
                    staleReason: null
                  equities:
                    - symbol: DANGCEM
                      companyName: Dangote Cement Plc
                      lastPriceNgn: 123.45
                      dailyChangePercent: 1.01
                      quoteTimestamp: "2026-10-22T09:40:00.000Z"
                      available: true
                      unavailableReason: null
                      quoteAgeSeconds: 1500
                    - symbol: NB
                      companyName: Nigerian Breweries Plc
                      lastPriceNgn: null
                      dailyChangePercent: null
                      quoteTimestamp: null
                      available: false
                      unavailableReason: NOT_IN_PROVIDER_RESPONSE
                      quoteAgeSeconds: null
                    - symbol: SEPLAT
                      companyName: Seplat Energy Plc
                      lastPriceNgn: null
                      dailyChangePercent: null
                      quoteTimestamp: null
                      available: false
                      unavailableReason: QUOTE_EXPIRED
                      quoteAgeSeconds: null
                  marketSummary:
                    tradingDate: "2026-10-22"
                    allShareIndex: 100000.5
                    allShareIndexChange: 500.25
                    allShareIndexChangePercent: 0.5
                    equityMarketCapitalisation: 50000
                    totalMarketCapitalisation: 60000
                    providerUpdatedAt: "2026-10-22T09:40:00.000Z"
                    refreshedAt: "2026-10-22T10:00:00.000Z"
                    isStale: false
                  generatedAt: "2026-10-22T10:05:00.000Z"
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          description: |
            `FEATURE_UNAVAILABLE` (context.status `disabled`) when the integration is
            not enabled/configured/approved, or `SERVICE_UNAVAILABLE` (context.status
            `unavailable`, with `reason` and `retryAfterSeconds`, plus a `Retry-After`
            header) when no servable cached data exists. `reason` is one of
            `REFRESH_IN_PROGRESS` (5 s), `REFRESH_FAILED` (300 s), `REFRESH_PAUSED`
            (300 s), `CACHE_UNAVAILABLE` (60 s) or `QUOTES_EXPIRED` (300 s; every
            cached quote is older than 7 days). Never cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                disabled:
                  value:
                    error:
                      code: FEATURE_UNAVAILABLE
                      message: Market data is not available.
                      context: { status: disabled }
                      requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
                unavailable:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Market data is temporarily unavailable.
                      context: { status: unavailable, reason: REFRESH_FAILED, retryAfterSeconds: 300 }
                      requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/register:
    post:
      tags:
        - Auth
      operationId: registerApplicant
      summary: Register an Individual investor or Corporate applicant
      description: |
        Creates a role-`INVESTOR` User, type-specific Individual profile or
        Corporate applicant display profile, and EmailVerificationChallenge
        atomically (single transaction). Corporate registration does not create
        an InvestorProfile or CorporateAccount. Registration NEVER issues a
        session, access token or refresh credential and NEVER marks the email
        verified — the client proceeds to email verification.

        Individual registration retains `firstName`, `lastName`, `email`,
        `password` (and the existing optional `registrationType: INDIVIDUAL`).
        Corporate registration accepts `registrationType: CORPORATE`,
        `companyName`, `companyPhoneNumber`, `email`, and `password`; both
        company fields are required only for Corporate. Company identity is
        persisted separately from O2 canonical legal details. `confirmPassword`
        remains frontend-only and all unapproved fields are rejected.

        Duplicate policy: `email` is stored in display form; uniqueness is
        enforced on `normalizedEmail` (trim + lowercase). Duplicate
        registrations return the same safe `CONFLICT` error without
        distinguishing verified vs unverified existing accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; verification code sent via email provider.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                data:
                  userId: "8c1c6f42-6d3e-4a7d-9d4c-1a2b3c4d5e6f"
                  verificationId: "5a4b3c2d-1e2f-4a5b-9c8d-7e6f5a4b3c2d"
                  email: "u***@example.com"
                  emailVerified: false
                  nextAction: "VERIFY_EMAIL"
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/email/verify:
    post:
      tags:
        - Auth
      operationId: verifyEmail
      summary: Verify email ownership with the 6-digit code
      description: |
        Confirms email ownership. Codes are 6 numeric digits from a CSPRNG,
        live 10 minutes, allow 5 attempts, and are single-use; successful
        verification consumes the challenge and sets `users.emailVerifiedAt`
        atomically. No session is created — the client proceeds to login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResponse"
              example:
                data:
                  emailVerified: true
                  nextAction: "LOGIN"
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "400":
          description: |
            `EMAIL_VERIFICATION_INVALID` (wrong code) or
            `EMAIL_VERIFICATION_EXPIRED` (past 10-minute lifetime).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Unknown `verificationId` (`EMAIL_VERIFICATION_INVALID`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Code already consumed (`EMAIL_VERIFICATION_CONSUMED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Attempt cap reached (`EMAIL_VERIFICATION_ATTEMPTS_EXCEEDED`) or endpoint throttled (`RATE_LIMITED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/email/resend:
    post:
      tags:
        - Auth
      operationId: resendVerificationEmail
      summary: Request a fresh verification code
      description: |
        Keeps the same `verificationId` while rotating code/verifier/expiry —
        the previous code is immediately invalidated. Enforces a 60-second
        cooldown (`RESEND_COOLDOWN`, with `error.context.retryAfterSeconds`)
        and a 5-resends-per-hour window (`RESEND_LIMIT_EXCEEDED`).
        Never returns the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: New code issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendVerificationResponse"
              example:
                data:
                  verificationId: "5a4b3c2d-1e2f-4a5b-9c8d-7e6f5a4b3c2d"
                  email: "u***@example.com"
                  expiresInSeconds: 600
                  resendInSeconds: 60
        "404":
          description: Unknown `verificationId` (`EMAIL_VERIFICATION_INVALID`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already verified (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Cooldown / hourly limit (`RESEND_COOLDOWN`, `RESEND_LIMIT_EXCEEDED`) or throttled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Sign in with email + password
      description: |
        Email is normalized (trim + lowercase) for lookup. Unknown email and
        wrong password produce the IDENTICAL public error (`401
        INVALID_CREDENTIALS`, equalized verification timing). A verified
        account is required — otherwise `403 EMAIL_NOT_VERIFIED` with safe
        context (`verificationId`, masked email) and NO session.

        On success (browser clients): the refresh credential is set as an
        HttpOnly `Set-Cookie` (`sf_refresh`; `__Host-sf_refresh` where the
        host-prefixed name is valid) and a readable signed CSRF cookie
        (`sf_csrf`). The refresh credential NEVER appears in the JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; session established.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: |
                `sf_refresh=<credential>; HttpOnly; SameSite=Lax; Path=/` (+`Secure`
                outside local development) and `sf_csrf=<signed-token>;
                SameSite=Lax; Path=/` (readable for the double-submit header).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIs..."
                  expiresInSeconds: 900
                  user:
                    id: "8c1c6f42-6d3e-4a7d-9d4c-1a2b3c4d5e6f"
                    firstName: "David"
                    lastName: "Example"
                    email: "user@example.com"
                    emailVerified: true
                    role: "INVESTOR"
                    primaryAccountType: "INDIVIDUAL"
                    authorizedContexts: ["INDIVIDUAL"]
                    jointMembershipCount: 0
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "401":
          description: Identical error for unknown email and wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: We could not sign you in with those details.
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "403":
          description: Email ownership not yet verified (no session issued).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: EMAIL_NOT_VERIFIED
                  message: Please verify your email address before signing in.
                  context:
                    verificationId: "5a4b3c2d-1e2f-4a5b-9c8d-7e6f5a4b3c2d"
                    email: "u***@example.com"
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshSession
      summary: Rotate the refresh credential and obtain a new access token
      description: |
        Requires the HttpOnly refresh cookie **and** the readable CSRF cookie
        echoed in the `X-CSRF-Token` header (signed double-submit, bound to the
        session), plus Origin/Referer allowlist policy for browser clients.

        On success the refresh credential is ROTATED (previous credential is
        permanently unusable), the idle window slides forward, and a new CSRF
        token + access JWT are issued. Presenting an already-rotated/used/
        revoked credential triggers **reuse detection: the entire session is
        revoked** and every credential tied to it dies (sign-in required).
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
          example: "sf_refresh=<opaque>; sf_csrf=<sessionId>.<token>.<hmac>"
      responses:
        "200":
          description: Rotated; new access token issued (new cookies set).
          headers:
            Set-Cookie:
              description: Rotated `sf_refresh` + `sf_csrf` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: Missing/invalid/expired/reused credential or expired/idle/revoked session (`UNAUTHENTICATED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: CSRF mismatch (`CSRF_VALIDATION_FAILED`) or untrusted browser origin (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Sign out, revoking the server-side session
      description: |
        Requires refresh + CSRF pair (same rules as refresh). Revokes the
        session server-side (`revokeReason = USER_LOGOUT`), revokes the current
        credential, and clears both cookies. Repeated logout is idempotent and
        returns the same success without leaking state.
      parameters:
        - $ref: "#/components/parameters/X-CSRF-Token"
        - name: Cookie
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Logged out; cookies cleared.
          headers:
            Set-Cookie:
              description: Expiring `sf_refresh` and `sf_csrf` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "403":
          description: CSRF mismatch or untrusted origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/InternalError"

  /me:
    get:
      tags:
        - Me
      operationId: getCurrentUser
      summary: Current authenticated user
      description: |
        Requires `Authorization: Bearer <access-token>`. Returns the approved
        safe projection only — never password hashes, `normalizedEmail`,
        session/token hashes, verification verifiers or internal secrets.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
              example:
                data:
                  id: "8c1c6f42-6d3e-4a7d-9d4c-1a2b3c4d5e6f"
                  firstName: "David"
                  lastName: "Example"
                  email: "user@example.com"
                  emailVerified: true
                  role: "INVESTOR"
                  primaryAccountType: "INDIVIDUAL"
                  authorizedContexts: ["INDIVIDUAL"]
                  jointMembershipCount: 0
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "401":
          description: Missing/invalid/expired token or malformed claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /corporate-accounts/{corporateAccountId}/profile:
    get:
      tags: [Corporate Profile]
      operationId: getOwnCorporateProfile
      summary: Read the current owner's Corporate Profile and saved-form progress
      description: |
        Requires a verified Corporate applicant identity and an existing real
        CorporateAccount/application owned by the authenticated initiator. UUIDs
        that are missing or not owned by this caller return the same generic
        404. This does not create a CorporateAccount/O2 identity. Progress is
        saved-form completion only and never implies submission, review, KYB
        verification, approval, or investment eligibility.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
      responses:
        "200":
          description: Safe owner-scoped profile; TIN and account number are masked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateProfileResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /corporate-accounts/{corporateAccountId}/profile/company-details:
    patch:
      tags: [Corporate Profile]
      operationId: saveCorporateCompanyDetails
      summary: Save Company Details atomically with canonical O4 fields
      description: |
        Requires bearer auth, owner proof, same-origin/cookie-mutation CSRF
        protection and rate limiting. Quoted `If-Match` must be
        `"profile-{profileVersion};details-{detailsVersion}"`. A stale version
        returns 409 without partial writes. The write reuses canonical O4
        validation, TIN encryption and audit; an empty/omitted TIN retains the
        current encrypted value. It does not alter the existing O4 route.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
        - $ref: "#/components/parameters/CorporateCompanyIfMatch"
        - $ref: "#/components/parameters/X-CSRF-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorporateCompanyDetailsPatch" }
      responses:
        "200":
          description: Committed section and new versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /corporate-accounts/{corporateAccountId}/profile/investment-profile:
    patch:
      tags: [Corporate Profile]
      operationId: saveCorporateInvestmentProfile
      summary: Save Investment Objective and Risk Profile
      description: >-
        Requires Company Details to be committed first. Uses quoted `If-Match: "profile-{profileVersion}"`; allowed values exactly match the checked-in UI. This is applicant-provided data, not an eligibility decision.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
        - $ref: "#/components/parameters/CorporateProfileIfMatch"
        - $ref: "#/components/parameters/X-CSRF-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorporateInvestmentProfilePatch" }
      responses:
        "200":
          description: Committed section and new versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /corporate-accounts/{corporateAccountId}/profile/source-of-funds:
    patch:
      tags: [Corporate Profile]
      operationId: saveCorporateSourceOfFunds
      summary: Save Source of Funds and Wealth
      description: >-
        Requires the prior section to be committed. NGN amounts are parsed with integer minor-unit arithmetic; `Other (specify)` requires `otherSource`. Quoted `If-Match: "profile-{profileVersion}"`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
        - $ref: "#/components/parameters/CorporateProfileIfMatch"
        - $ref: "#/components/parameters/X-CSRF-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorporateSourceOfFundsPatch" }
      responses:
        "200":
          description: Committed section and new versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /corporate-accounts/{corporateAccountId}/profile/bank-details:
    patch:
      tags: [Corporate Profile]
      operationId: saveCorporateBankDetails
      summary: Save Bank Details with a dedicated KMS account-number envelope
      description: >-
        Requires the prior section to be committed. `accountNumber` must be ten digits and is encrypted with a purpose-isolated KMS key/context; reads and history contain only its mask. `bvnLinkedToAccount` is a declaration, not a BVN value or bank verification. Quoted `If-Match: "profile-{profileVersion}"`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
        - $ref: "#/components/parameters/CorporateProfileIfMatch"
        - $ref: "#/components/parameters/X-CSRF-Token"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorporateBankDetailsPatch" }
      responses:
        "200":
          description: Committed section and new versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /corporate-accounts/{corporateAccountId}/kyc-documents:
    get:
      tags: [Corporate KYC Documents]
      operationId: getCorporateKycDocumentRequirements
      summary: Section 5 — the three mandatory document requirements, current uploads and submission readiness
      description: |
        Authoritative requirement list for Corporate KYC section 5. Returns
        exactly three mandatory categories (CERTIFICATE_OF_INCORPORATION,
        MEMART, TIN_CERTIFICATE), accepted types, size limit, the current
        version of each upload, replacement eligibility and the server-computed
        submission blockers. Requires a verified Corporate applicant identity
        and initiator ownership; missing or non-owned accounts return the same
        generic 404. Storage keys and object URLs are never returned.
        `scanStatus` is always `NOT_SCANNED` (no Corporate scanner is wired);
        `reviewStatus` is derived from the application lifecycle and never
        claims review before staff accept the application. Rate limit 60/hour/user.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
      responses:
        "200":
          description: Requirements, current uploads and readiness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateKycDocumentsResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /corporate-accounts/{corporateAccountId}/kyc-documents/{category}:
    post:
      tags: [Corporate KYC Documents]
      operationId: uploadCorporateKycDocument
      summary: Upload (or explicitly replace) one of the three mandatory documents
      description: |
        `multipart/form-data` with exactly one file in field `file` (PDF, JPEG
        or PNG; 1 byte – 4 MiB = 4,194,304 bytes). The server verifies the file
        signature (magic bytes), that the declared MIME type and extension agree
        with it, and PDF structure (rejects truncated, password-protected and
        script/attachment/XFA PDFs). This is a structural check, not a malware
        scan. The original filename is never stored; a generated
        `displayFilename` is used.

        Replacement is explicit: when a current document exists, send
        `replacesDocumentId` equal to its `documentId`; a first upload must
        omit it. Each replacement creates a new immutable version; the previous
        version is retained (superseded) for audit. Allowed only while the
        application is DRAFT or INFO_REQUESTED.

        Guards: bearer auth, INVESTOR role, verified Corporate applicant,
        Origin + signed double-submit CSRF (`sf_csrf` cookie = `X-CSRF-Token`),
        then 20/hour/user rate limit. Guards run before the file is parsed.
        Returns the full updated section view.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
        - $ref: "#/components/parameters/X-CSRF-Token"
        - name: category
          in: path
          required: true
          schema: { $ref: "#/components/schemas/CorporateKycDocumentCategory" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: application/pdf, image/jpeg or image/png; max 4,194,304 bytes.
                replacesDocumentId:
                  type: string
                  format: uuid
                  description: Required when replacing; must equal the current documentId for this category.
              required: [file]
      responses:
        "201":
          description: Stored privately; the updated section view is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateKycDocumentsResponse" }
        "400":
          description: Unknown category (anything other than the three approved), missing file, malformed replacesDocumentId or too many multipart parts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: Replacement mismatch (missing/stale replacesDocumentId, or nothing to replace) or the application is no longer editable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          description: File larger than 4 MiB (`FILE_TOO_LARGE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415":
          description: Not a PDF/JPEG/PNG by signature, declared type or extension mismatch, or a rejected PDF structure (`UNSUPPORTED_FILE_TYPE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/FeatureUnavailableError" }

  /corporate-accounts/{corporateAccountId}/kyc-documents/{documentId}/view-authorization:
    post:
      tags: [Corporate KYC Documents]
      operationId: authorizeCorporateKycDocumentView
      summary: Short-lived, version-pinned download grant for the owner's current document
      description: |
        Returns a signed private-storage URL valid for at most 60 seconds,
        pinned to the exact stored object version, served as
        `attachment` / `application/octet-stream` / `no-store`. Only the
        current version of a document belonging to the caller's own
        application is eligible; anything else is a generic 404. Each grant is
        recorded in the append-only audit before the URL is returned. Do not
        cache, log or persist `viewUrl`; request a new grant on each view.
        CSRF + Origin required; 30/hour/user.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
        - $ref: "#/components/parameters/X-CSRF-Token"
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Grant issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateKycViewAuthorizationResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/FeatureUnavailableError" }

  /corporate-accounts/{corporateAccountId}/submission:
    post:
      tags: [Corporate KYC Documents]
      operationId: submitCorporateApplication
      summary: Submit the Corporate application for Starfetch review (DRAFT → SUBMITTED)
      description: |
        Requires an `Idempotency-Key` header (8–255 chars, no CR/LF/NUL). The
        server re-proves ownership and, under a row lock, checks that all four
        profile sections are COMPLETE against the current canonical details
        (the same staleness rule as the Profile API) with stored values present,
        and that all three mandatory documents have a current upload. On success
        it records an immutable submission pinning the profile/details versions
        and the three document versions, moves DRAFT → SUBMITTED (sets
        `submittedAt`/`submittedByUserId`) and appends a SUBMITTED history row.
        It never sets IN_REVIEW, APPROVED or any verified state — staff review
        has not started at this point.

        Idempotency: repeating with the same key returns the original receipt
        (`idempotentReplay: true`, current `applicationStatus`). A different key
        after submission returns 409 with `context.reason = ALREADY_SUBMITTED`.
        Concurrent submissions serialize to exactly one. CSRF + Origin required;
        10/hour/user. Resubmission after INFO_REQUESTED is not yet supported.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/CorporateAccountId"
        - $ref: "#/components/parameters/X-CSRF-Token"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Submitted (or idempotent replay of the original submission).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorporateSubmissionResponse" }
        "400":
          description: Missing or invalid Idempotency-Key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/UnauthorizedError" }
        "403": { $ref: "#/components/responses/ForbiddenError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409":
          description: |
            `context.reason = SUBMISSION_INCOMPLETE` with `context.blockers`
            (same shape as `submission.blockers` in the GET), or
            `context.reason = ALREADY_SUBMITTED` with `submissionId` and
            `applicationStatus`, or a concurrent-change conflict (retry).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: CONFLICT
                  message: Complete all profile sections and upload all three required documents before submitting.
                  context:
                    reason: SUBMISSION_INCOMPLETE
                    blockers:
                      - { kind: PROFILE_SECTION, key: bankDetails }
                      - { kind: DOCUMENT, key: TIN_CERTIFICATE }
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "429": { $ref: "#/components/responses/RateLimitError" }
        "500": { $ref: "#/components/responses/InternalError" }

  /me/profile:
    get:
      tags:
        - Me
      operationId: getOwnInvestorProfile
      summary: Current investor's profile (INVESTOR role only)
      description: |
        Requires `Authorization: Bearer <access-token>` **and** role
        `INVESTOR` (enforced server-side via RolesGuard — frontend route
        guards are UX only). Returns ONLY the authenticated principal's own
        profile — ownership is derived from the validated token, never from
        request parameters. `email` is read-only, sourced from the User
        record. The projection NEVER includes password hashes,
        `normalizedEmail`, session/token data, verification verifiers, or any
        internal field.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated investor's profile.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfileResponse"
              example:
                data:
                  firstName: "David"
                  lastName: "Example"
                  email: "user@example.com"
                  phone: null
                meta:
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "401":
          description: Missing/invalid/expired token or malformed claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated principal is not an INVESTOR (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have access to this resource.
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "404":
          description: Profile record absent for the principal (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Me
      operationId: updateOwnInvestorProfile
      summary: Update the current investor's profile (INVESTOR role only)
      description: |
        Requires `Authorization: Bearer <access-token>` **and** role
        `INVESTOR`. Ownership is ALWAYS the authenticated principal — **no
        `userId` is accepted from body or query**; one investor can never
        target another's profile here.

        Updatable fields (all optional, at least one required): `firstName`,
        `lastName` (trimmed, 1–60 chars) and optional `phone` (pragmatic
        local/international format; explicit `null` clears it). **`email` is
        NOT editable through this endpoint** — it is not part of the schema
        and is rejected as an unknown field. No other profile/KYC fields
        exist on this surface.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated; returns the updated projection.
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorProfileResponse"
        "400":
          description: |
            Validation failure (`VALIDATION_FAILED`): invalid/empty text,
            bad phone format, empty body, `email`/unknown/unapproved fields,
            or a `userId` targeting attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing/invalid/expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated principal is not an INVESTOR (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Profile record absent for the principal (`NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/portfolio:
    get:
      tags:
        - Me
      operationId: getOwnPortfolio
      summary: Current investor's portfolio (INVESTOR role only)
      description: |
        Dashboard read for the authenticated investor's portfolio.
        `userId` is NEVER accepted from query/body/path — ownership comes
        exclusively from the validated bearer token.

        **Empty state is normal and successful**: a new investor has no
        portfolio/holding rows and receives `totalValueMinor: 0`,
        `holdingCount: 0`, `holdings: []`. The backend NEVER seeds demo or
        fake records to populate the dashboard.

        Money semantics: all amounts are **minor units** (kobo for NGN).
        `totalValueMinor` aggregates STORED holding values only — there is NO
        market valuation logic, and no rates, yields, fees, performance or
        gains are computed or returned. `totalReturnMinor` is always `null`
        until an approved return/cost-basis calculation exists.

        `meta` additionally carries `asOf` (ISO timestamp of this snapshot)
        alongside the standard `requestId`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Portfolio snapshot (empty state for new investors).
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
              example:
                data:
                  currency: "NGN"
                  totalValueMinor: 0
                  holdingCount: 0
                  totalReturnMinor: null
                  holdings: []
                meta:
                  asOf: "2026-11-03T14:40:00.000Z"
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "401":
          description: Missing/invalid/expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated principal is not an INVESTOR (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/transactions:
    get:
      tags:
        - Me
      operationId: listOwnTransactions
      summary: Current investor's transaction list (INVESTOR role only)
      description: |
        Paginated ledger read for the authenticated investor. `userId` is
        NEVER accepted — unknown query fields are rejected
        (`400 VALIDATION_FAILED`), and ownership comes exclusively from the
        bearer token. New investors receive an empty `data` array with
        `total: 0`; rows are real records only (never demo data).

        Ordering: newest first (`occurredAt` descending). Money semantics as
        per `/me/portfolio`: minor units, currency attributes on each row;
        `amountMinor` is signed (credit positive / debit negative).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1, example: 1 }
          description: 1-based page number.
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20, example: 5 }
          description: Page size (1–100; dashboard baseline uses 5).
      responses:
        "200":
          description: Page of transactions (may be legitimately empty).
          headers:
            x-request-id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPageResponse"
              example:
                data: []
                meta:
                  page: 1
                  pageSize: 5
                  total: 0
                  requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
        "400":
          description: Invalid pagination or unknown query field (e.g. a `userId` targeting attempt).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing/invalid/expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated principal is not an INVESTOR (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived HS256 access JWT (15 minutes). Claims are minimal:
        `sub` (user id), `role`, `sid` (session id), `iat`, `exp`. Tokens never
        carry KYC/phone/financial/portfolio/document data.

  parameters:
    CorporateAccountId:
      name: corporateAccountId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Existing, real CorporateAccount UUID; never an application ID or user-supplied owner.
    CorporateProfileIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      example: '"profile-1"'
      description: Quoted current profile version, e.g. "profile-1".
    CorporateCompanyIfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      example: '"profile-1;details-4"'
      description: Both quoted versions are required for the atomic combined Company Details/O4 save.
    X-CSRF-Token:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        Signed double-submit CSRF token — must equal the readable `sf_csrf`
        cookie value (`<sessionId>.<token>.<HMAC-SHA-256>`) and is bound to the
        authenticated session. Rotated on every successful refresh.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated unique key (8–255 chars, no CR/LF/NUL), e.g. a UUID generated once per submit intent and reused on retries. Only a domain-separated digest is stored.
      schema: { type: string, minLength: 8, maxLength: 255 }

  headers:
    X-Request-Id:
      description: |
        Correlation identifier for the request. A client may supply a safe value
        (`x-request-id` request header, 8–100 chars of `[A-Za-z0-9._-]`); it is
        echoed back. Otherwise the server generates one (UUID). Present on every
        response, including errors — also for `/` and unknown paths.
      schema:
        type: string
        example: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

  schemas:
    Meta:
      type: object
      properties:
        requestId:
          type: string
          description: Server-set correlation ID (matches the x-request-id header).
      required:
        - requestId

    HealthData:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Informational API version string.
      required:
        - status
        - version

    HealthResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/HealthData"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
        - data
        - meta

    PublicMarketEquity:
      type: object
      properties:
        symbol: { type: string, example: DANGCEM }
        companyName: { type: string, description: Starfetch display name for the configured symbol. }
        lastPriceNgn: { type: number, nullable: true, description: Provider last price in NGN; null when unavailable. }
        dailyChangePercent: { type: number, nullable: true, description: Provider-supplied daily % change; never computed. }
        quoteTimestamp:
          type: string
          format: date-time
          nullable: true
          description: Provider quote time (last_updated), normalised to UTC; never substituted. Null when unavailable.
        available: { type: boolean }
        unavailableReason:
          type: string
          nullable: true
          description: |
            Why the equity is unavailable. Additive enum: treat unknown values as
            generic "unavailable". `INVALID_PROVIDER_DATA` is retained for
            compatibility; current code emits the specific reasons.
          enum:
            - NOT_IN_PROVIDER_RESPONSE
            - INVALID_PROVIDER_DATA
            - DUPLICATE_IN_PROVIDER_RESPONSE
            - MISSING_QUOTE_TIMESTAMP
            - INVALID_QUOTE_TIMESTAMP
            - FUTURE_QUOTE_TIMESTAMP
            - INVALID_PRICE
            - QUOTE_EXPIRED
            - null
        quoteAgeSeconds:
          type: integer
          nullable: true
          minimum: 0
          maximum: 604800
          description: Age of quoteTimestamp at generatedAt, in seconds (additive field). Null when unavailable.
      required: [symbol, companyName, lastPriceNgn, dailyChangePercent, quoteTimestamp, available, unavailableReason, quoteAgeSeconds]

    PublicMarketSummary:
      type: object
      nullable: true
      description: Provider NGX summary (latest available trading day). Never derived from equities.
      properties:
        tradingDate: { type: string, format: date }
        allShareIndex: { type: number, nullable: true }
        allShareIndexChange: { type: number, nullable: true }
        allShareIndexChangePercent: { type: number, nullable: true }
        equityMarketCapitalisation: { type: number, nullable: true, description: As supplied by the provider (unit undocumented — verify before display). }
        totalMarketCapitalisation: { type: number, nullable: true, description: As supplied by the provider (unit undocumented — verify before display). }
        providerUpdatedAt: { type: string, format: date-time, nullable: true }
        refreshedAt: { type: string, format: date-time, description: When Starfetch last fetched the summary. }
        isStale: { type: boolean }
      required: [tradingDate, allShareIndex, allShareIndexChange, allShareIndexChangePercent, equityMarketCapitalisation, totalMarketCapitalisation, providerUpdatedAt, refreshedAt, isStale]

    PublicMarketSnapshot:
      type: object
      properties:
        status: { type: string, enum: [ok, stale] }
        provider:
          type: object
          properties:
            name: { type: string, example: NGN Market }
            url: { type: string, example: "https://ngnmarket.com" }
            attribution: { type: string }
          required: [name, url, attribution]
        dataType: { type: string, enum: [delayed] }
        delayNotice: { type: string }
        cache:
          type: object
          properties:
            refreshedAt: { type: string, format: date-time, description: When Starfetch last refreshed equities from the provider (not the quote time). }
            ageSeconds: { type: integer }
            refreshIntervalSeconds: { type: integer }
            nextRefreshDueAt: { type: string, format: date-time }
            isStale: { type: boolean }
            staleReason: { type: string, nullable: true, enum: [REFRESH_IN_PROGRESS, REFRESH_FAILED, REFRESH_PAUSED, null] }
          required: [refreshedAt, ageSeconds, refreshIntervalSeconds, nextRefreshDueAt, isStale, staleReason]
        equities:
          type: array
          description: Always the 14 configured homepage equities in homepage order (examples are abridged).
          items: { $ref: "#/components/schemas/PublicMarketEquity" }
        marketSummary:
          $ref: "#/components/schemas/PublicMarketSummary"
        generatedAt: { type: string, format: date-time }
      required: [status, provider, dataType, delayNotice, cache, equities, marketSummary, generatedAt]

    PublicMarketSnapshotResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/PublicMarketSnapshot" }
        meta: { $ref: "#/components/schemas/Meta" }
      required: [data, meta]

    RegisterRequest:
      oneOf:
        - $ref: "#/components/schemas/IndividualRegisterRequest"
        - $ref: "#/components/schemas/CorporateRegisterRequest"
      description: Conditional payload matching the fixed frontend registration forms.

    IndividualRegisterRequest:
      type: object
      additionalProperties: false
      properties:
        registrationType: { type: string, enum: [INDIVIDUAL] }
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128 }
      required: [firstName, lastName, email, password]

    CorporateRegisterRequest:
      type: object
      additionalProperties: false
      properties:
        registrationType: { type: string, enum: [CORPORATE] }
        companyName: { type: string, minLength: 1, maxLength: 160 }
        companyPhoneNumber: { type: string, minLength: 7, maxLength: 32, pattern: "^\\+?[0-9][0-9()\\-\\s]{5,18}[0-9]$" }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128 }
      required: [registrationType, companyName, companyPhoneNumber, email, password]

    RegisterResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            userId: { type: string, format: uuid }
            verificationId: { type: string, format: uuid }
            email:
              type: string
              description: Masked email (e.g. `u***@example.com`).
            emailVerified: { type: boolean, enum: [false] }
            nextAction: { type: string, enum: [VERIFY_EMAIL] }
          required: [userId, verificationId, email, emailVerified, nextAction]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      properties:
        verificationId: { type: string, format: uuid }
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required: [verificationId, code]

    VerifyEmailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            emailVerified: { type: boolean, enum: [true] }
            nextAction: { type: string, enum: [LOGIN] }
          required: [emailVerified, nextAction]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    ResendVerificationRequest:
      type: object
      additionalProperties: false
      properties:
        verificationId: { type: string, format: uuid }
      required: [verificationId]

    ResendVerificationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            verificationId: { type: string, format: uuid }
            email: { type: string, description: Masked email. }
            expiresInSeconds: { type: integer, example: 600 }
            resendInSeconds: { type: integer, example: 60 }
          required: [verificationId, email, expiresInSeconds, resendInSeconds]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128 }
      required: [email, password]

    SafeUser:
      type: object
      description: Public projection — never includes hashes or normalizedEmail. Account type/context is DB-derived and never reflects the unsent login selector.
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        role: { type: string, enum: [INVESTOR, STAFF, ADMIN] }
        primaryAccountType: { type: string, nullable: true, enum: [INDIVIDUAL, CORPORATE] }
        companyName: { type: string, description: Present only for a persisted Corporate applicant identity. }
        companyPhoneNumber: { type: string, description: Present only for a persisted Corporate applicant identity. }
        authorizedContexts:
          type: array
          items: { type: string, enum: [INDIVIDUAL, CORPORATE, JOINT] }
          description: Derived from assigned primary kind, applicant identity and current membership rows.
        jointMembershipCount: { type: integer, minimum: 0 }
      required: [id, firstName, lastName, email, emailVerified, role, primaryAccountType, authorizedContexts, jointMembershipCount]

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string, description: HS256 JWT, 15-minute TTL. }
            expiresInSeconds: { type: integer, example: 900 }
            user:
              $ref: "#/components/schemas/SafeUser"
          required: [accessToken, expiresInSeconds, user]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    RefreshResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            expiresInSeconds: { type: integer, example: 900 }
          required: [accessToken, expiresInSeconds]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    LogoutResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            loggedOut: { type: boolean, enum: [true] }
          required: [loggedOut]
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    MeResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SafeUser"
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    InvestorProfileData:
      type: object
      description: |
        Approved safe investor-profile projection (Phase 2C). `email` is
        read-only, owned by the User record. NEVER includes passwordHash,
        normalizedEmail, session/token data, or any internal field.
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email, readOnly: true }
        phone:
          type: string
          nullable: true
          description: Optional; `null` when unset. Explicit `null` on PUT clears it.
      required: [firstName, lastName, email, phone]

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      description: |
        All fields optional; at least one required. Unknown fields —
        explicitly including `email` and any `userId`/targeting field — are
        rejected (`VALIDATION_FAILED`).
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed server-side.
        lastName:
          type: string
          minLength: 1
          maxLength: 60
          description: Trimmed server-side.
        phone:
          type: string
          nullable: true
          pattern: "^\\+?[0-9][0-9()\\-\\s]{5,18}[0-9]$"
          description: Pragmatic local/international format; explicit `null` clears the value.

    InvestorProfileResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/InvestorProfileData"
        meta:
          $ref: "#/components/schemas/Meta"
      required: [data, meta]

    CorporateCompanyDetailsPatch:
      type: object
      additionalProperties: false
      properties:
        rcNumber: { type: string, minLength: 1, maxLength: 255 }
        dateOfIncorporation: { type: string, format: date, description: Must be a valid non-future date. }
        taxIdentificationNumber: { type: string, writeOnly: true, minLength: 1, maxLength: 256, description: Omit or send empty to retain existing encrypted TIN; no clear operation. }
        registeredAddress: { type: string, minLength: 1, maxLength: 255 }
        city: { type: string, minLength: 1, maxLength: 120 }
        state: { type: string, minLength: 1, maxLength: 120 }
      required: [rcNumber, dateOfIncorporation, registeredAddress, city, state]

    CorporateInvestmentProfilePatch:
      type: object
      additionalProperties: false
      properties:
        primaryObjective: { type: string, enum: [Capital preservation, Income, Balanced, Growth] }
        riskTolerance: { type: string, enum: [Conservative, Moderate, Balanced, Aggressive] }
        investmentHorizon: { type: string, enum: ["< 1 year", "1–3 years", "3–5 years", "5 years +"] }
        expectedWithdrawals: { type: string, minLength: 1, maxLength: 120 }
        withdrawalFrequency: { type: string, minLength: 1, maxLength: 120 }
        restrictionsOrExclusions: { type: string, maxLength: 500 }
      required: [primaryObjective, riskTolerance, investmentHorizon, expectedWithdrawals, withdrawalFrequency]

    CorporateSourceOfFundsPatch:
      type: object
      additionalProperties: false
      properties:
        selectedSources:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { type: string, enum: [Business income / operating cash, Sale of assets, Loan / financing, Other (specify)] }
        otherSource: { type: string, maxLength: 500 }
        expectedAnnualInflow: { type: string, pattern: "^\\d{1,15}(?:\\.\\d{1,2})?$", description: "NGN numeric text, parsed safely into integer kobo." }
        expectedTransactionFrequency: { type: string, minLength: 1, maxLength: 120 }
      required: [selectedSources, expectedAnnualInflow, expectedTransactionFrequency]

    CorporateBankDetailsPatch:
      type: object
      additionalProperties: false
      properties:
        bankName: { type: string, minLength: 1, maxLength: 120 }
        accountNumber: { type: string, writeOnly: true, pattern: "^\\d{10}$", description: "Ten-digit NUBAN, encrypted at rest and never returned." }
        accountName: { type: string, minLength: 1, maxLength: 160 }
        accountType: { type: string, minLength: 1, maxLength: 80 }
        bvnLinkedToAccount: { type: boolean, description: Applicant declaration only; no BVN is collected or verified. }
      required: [bankName, accountNumber, accountName, accountType, bvnLinkedToAccount]

    CorporateProfileData:
      type: object
      properties:
        corporateAccountId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        applicant:
          type: object
          properties:
            companyName: { type: string, nullable: true }
            companyPhoneNumber: { type: string, nullable: true }
            email: { type: string, format: email }
          required: [companyName, companyPhoneNumber, email]
        canonicalDetails:
          type: object
          description: Canonical O2/O3 record; TIN is masked, never duplicated or returned in raw form.
          properties:
            institutionName: { type: string }
            dateOfIncorporation: { type: string, format: date }
            rcNumber: { type: string }
            businessPhoneNumber: { type: string }
            businessEmail: { type: string, format: email }
            taxIdentificationNumberMasked: { type: string, nullable: true }
          required: [institutionName, dateOfIncorporation, rcNumber, businessPhoneNumber, businessEmail, taxIdentificationNumberMasked]
        companyDetails:
          type: object
          properties:
            registeredAddress: { type: string, nullable: true }
            city: { type: string, nullable: true }
            state: { type: string, nullable: true }
          required: [registeredAddress, city, state]
        investmentProfile:
          type: object
          properties:
            primaryObjective: { type: string, nullable: true }
            riskTolerance: { type: string, nullable: true }
            investmentHorizon: { type: string, nullable: true }
            expectedWithdrawals: { type: string, nullable: true }
            withdrawalFrequency: { type: string, nullable: true }
            restrictionsOrExclusions: { type: string, nullable: true }
          required: [primaryObjective, riskTolerance, investmentHorizon, expectedWithdrawals, withdrawalFrequency, restrictionsOrExclusions]
        sourceOfFunds:
          type: object
          properties:
            selectedSources: { type: array, items: { type: string } }
            otherSource: { type: string, nullable: true }
            expectedAnnualInflow: { type: string, nullable: true, description: Decimal NGN display value derived from integer kobo. }
            expectedTransactionFrequency: { type: string, nullable: true }
          required: [selectedSources, otherSource, expectedAnnualInflow, expectedTransactionFrequency]
        bankDetails:
          type: object
          properties:
            bankName: { type: string, nullable: true }
            accountNumberMasked: { type: string, nullable: true }
            accountName: { type: string, nullable: true }
            accountType: { type: string, nullable: true }
            bvnLinkedToAccount: { type: boolean, nullable: true }
          required: [bankName, accountNumberMasked, accountName, accountType, bvnLinkedToAccount]
        profileVersion: { type: integer, minimum: 0 }
        detailsVersion: { type: integer, minimum: 1 }
        sectionStatuses:
          type: object
          properties:
            companyDetails: { type: string, enum: [NOT_STARTED, DRAFT, COMPLETE] }
            investmentProfile: { type: string, enum: [NOT_STARTED, DRAFT, COMPLETE] }
            sourceOfFunds: { type: string, enum: [NOT_STARTED, DRAFT, COMPLETE] }
            bankDetails: { type: string, enum: [NOT_STARTED, DRAFT, COMPLETE] }
          required: [companyDetails, investmentProfile, sourceOfFunds, bankDetails]
        progress:
          type: object
          properties:
            percentage: { type: integer, enum: [0, 25, 50, 75, 100] }
            nextSection: { type: string, nullable: true, enum: [companyDetails, investmentProfile, sourceOfFunds, bankDetails] }
            canSubmit: { type: boolean, enum: [false] }
            meaning: { type: string, enum: [SAVED_FORM_COMPLETION_ONLY] }
          required: [percentage, nextSection, canSubmit, meaning]
        updatedAt: { type: string, format: date-time, nullable: true }
      required: [corporateAccountId, applicationId, applicant, canonicalDetails, companyDetails, investmentProfile, sourceOfFunds, bankDetails, profileVersion, detailsVersion, sectionStatuses, progress, updatedAt]

    CorporateProfileResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/CorporateProfileData" }
        meta: { $ref: "#/components/schemas/Meta" }
      required: [data, meta]

    CorporateKycDocumentCategory:
      type: string
      description: Exactly the three approved mandatory Corporate KYC documents. No other value is accepted.
      enum: [CERTIFICATE_OF_INCORPORATION, MEMART, TIN_CERTIFICATE]

    CorporateKycDocument:
      type: object
      description: Safe metadata for the current version. No storage key, URL or original filename.
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer, minimum: 1, maximum: 4194304 }
        displayFilename: { type: string, example: memart-v2.pdf }
        uploadedAt: { type: string, format: date-time }
        scanStatus:
          type: string
          enum: [NOT_SCANNED]
          description: No malware scanner is wired for Corporate documents; never reported as clean.
        reviewStatus:
          type: string
          enum: [NOT_SUBMITTED, AWAITING_REVIEW, UNDER_REVIEW, INFORMATION_REQUESTED, REVIEW_COMPLETED]
          description: |
            Derived from the application status: DRAFT → NOT_SUBMITTED, SUBMITTED → AWAITING_REVIEW,
            IN_REVIEW → UNDER_REVIEW (only after the staff workflow accepts it), INFO_REQUESTED →
            INFORMATION_REQUESTED, APPROVED/REJECTED → REVIEW_COMPLETED. Not a per-document verification.
      required: [documentId, version, contentType, sizeBytes, displayFilename, uploadedAt, scanStatus, reviewStatus]

    CorporateKycRequirement:
      type: object
      properties:
        category: { $ref: "#/components/schemas/CorporateKycDocumentCategory" }
        title: { type: string, example: Certificate of Incorporation }
        description: { type: string }
        mandatory: { type: boolean, enum: [true] }
        acceptedContentTypes: { type: array, items: { type: string }, example: [application/pdf, image/jpeg, image/png] }
        acceptedExtensions: { type: array, items: { type: string }, example: [.pdf, .jpg, .jpeg, .png] }
        maxSizeBytes: { type: integer, example: 4194304 }
        uploadStatus: { type: string, enum: [NOT_UPLOADED, UPLOADED] }
        canUpload: { type: boolean, description: True when no current document exists and the application is editable. }
        canReplace: { type: boolean, description: True when a current document exists and the application is editable. }
        blockedReason: { type: string, enum: [APPLICATION_NOT_EDITABLE], nullable: true }
        currentDocument:
          type: object
          nullable: true
          description: Current version (see CorporateKycDocument), or null when not uploaded.
          allOf: [{ $ref: "#/components/schemas/CorporateKycDocument" }]
      required: [category, title, description, mandatory, acceptedContentTypes, acceptedExtensions, maxSizeBytes, uploadStatus, canUpload, canReplace, blockedReason, currentDocument]

    CorporateSubmissionBlocker:
      type: object
      properties:
        kind: { type: string, enum: [APPLICATION_STATE, PROFILE_SECTION, DOCUMENT] }
        key:
          type: string
          description: Application status (APPLICATION_STATE), profile section key companyDetails|investmentProfile|sourceOfFunds|bankDetails (PROFILE_SECTION), or document category (DOCUMENT).
      required: [kind, key]

    CorporateKycDocumentsData:
      type: object
      properties:
        corporateAccountId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        applicationStatus: { type: string, enum: [DRAFT, SUBMITTED, IN_REVIEW, INFO_REQUESTED, APPROVED, REJECTED] }
        section:
          type: object
          properties:
            key: { type: string, enum: [kycDocuments] }
            order: { type: integer, enum: [5] }
            status: { type: string, enum: [NOT_STARTED, DRAFT, COMPLETE], description: "0 uploaded → NOT_STARTED; 1–2 → DRAFT; 3 → COMPLETE." }
            uploadedCount: { type: integer, minimum: 0, maximum: 3 }
            requiredCount: { type: integer, enum: [3] }
          required: [key, order, status, uploadedCount, requiredCount]
        limits:
          type: object
          properties:
            acceptedContentTypes: { type: array, items: { type: string } }
            acceptedExtensions: { type: array, items: { type: string } }
            maxSizeBytes: { type: integer, example: 4194304 }
          required: [acceptedContentTypes, acceptedExtensions, maxSizeBytes]
        requirements:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/CorporateKycRequirement" }
        submission:
          type: object
          properties:
            canSubmit: { type: boolean }
            blockers: { type: array, items: { $ref: "#/components/schemas/CorporateSubmissionBlocker" } }
            submissionId: { type: string, format: uuid, nullable: true }
            submittedAt: { type: string, format: date-time, nullable: true }
          required: [canSubmit, blockers, submissionId, submittedAt]
      required: [corporateAccountId, applicationId, applicationStatus, section, limits, requirements, submission]

    CorporateKycDocumentsResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/CorporateKycDocumentsData" }
        meta: { $ref: "#/components/schemas/Meta" }
      required: [data, meta]

    CorporateKycViewAuthorizationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            documentId: { type: string, format: uuid }
            category: { $ref: "#/components/schemas/CorporateKycDocumentCategory" }
            version: { type: integer }
            viewUrl: { type: string, format: uri, description: "Signed, ≤60 s, version-pinned private-storage URL. Do not cache, log or persist." }
            expiresAt: { type: string, format: date-time }
            disposition: { type: string, enum: [attachment] }
          required: [documentId, category, version, viewUrl, expiresAt, disposition]
        meta: { $ref: "#/components/schemas/Meta" }
      required: [data, meta]

    CorporateSubmissionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            submissionId: { type: string, format: uuid, description: Submission reference. }
            applicationId: { type: string, format: uuid }
            corporateAccountId: { type: string, format: uuid }
            applicationStatus:
              type: string
              enum: [SUBMITTED, IN_REVIEW, INFO_REQUESTED, APPROVED, REJECTED]
              description: Actual current status. SUBMITTED immediately after submission; later values appear only through the staff workflow.
            submittedAt: { type: string, format: date-time }
            profileVersion: { type: integer }
            detailsVersion: { type: integer }
            documents:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: object
                properties:
                  category: { $ref: "#/components/schemas/CorporateKycDocumentCategory" }
                  documentId: { type: string, format: uuid }
                required: [category, documentId]
            idempotentReplay: { type: boolean }
          required: [submissionId, applicationId, corporateAccountId, applicationStatus, submittedAt, profileVersion, detailsVersion, documents, idempotentReplay]
        meta: { $ref: "#/components/schemas/Meta" }
      required: [data, meta]

    HoldingItem:
      type: object
      description: Stored holding row (minor units; no valuation logic applied).
      properties:
        id: { type: string, format: uuid }
        instrumentLabel: { type: string }
        quantity:
          type: string
          nullable: true
          description: Decimal quantity serialized as a string; null when not applicable.
        valueMinor: { type: integer, format: int64 }
        currency: { type: string, example: "NGN" }
        asOf: { type: string, format: date-time }
        isDemo:
          type: boolean
          enum: [false]
          description: Always false — demo/fake records do not exist in the platform.
      required: [id, instrumentLabel, quantity, valueMinor, currency, asOf, isDemo]

    PortfolioData:
      type: object
      properties:
        currency: { type: string, enum: ["NGN"] }
        totalValueMinor:
          type: integer
          format: int64
          description: Sum of STORED holding values only (minor units).
        holdingCount: { type: integer }
        totalReturnMinor:
          type: integer
          format: int64
          nullable: true
          description: Always null until an approved return calculation exists.
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/HoldingItem"
      required: [currency, totalValueMinor, holdingCount, totalReturnMinor, holdings]

    PortfolioResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/PortfolioData"
        meta:
          type: object
          properties:
            requestId: { type: string }
            asOf:
              type: string
              format: date-time
              description: Snapshot timestamp.
          required: [requestId, asOf]
      required: [data, meta]

    TransactionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: Business vocabulary pinned by a later approved contract. }
        status: { type: string }
        amountMinor:
          type: integer
          format: int64
          description: Signed minor units (credit positive / debit negative).
        currency: { type: string, example: "NGN" }
        description: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
      required: [id, type, status, amountMinor, currency, description, occurredAt]

    TransactionPageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TransactionItem"
        meta:
          type: object
          properties:
            requestId: { type: string }
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
          required: [requestId, page, pageSize, total]
      required: [data, meta]

    Error:
      type: object
      description: |
        Stable error envelope. `message` is always safe for clients; internals
        are never exposed.
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
          description: Per-field validation details (present for VALIDATION_FAILED).
        context:
          type: object
          description: |
            Safe, client-presentable extras (e.g. EMAIL_NOT_VERIFIED carries
            `{ verificationId, email }` (masked); 429 classes may carry
            `{ retryAfterSeconds }`). Never internals.
        requestId:
          type: string
      required:
        - code
        - message
        - requestId

    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
        - error

    ErrorCode:
      type: string
      description: |
        Implemented error-code vocabulary (foundation + Phase 2B
        authentication). The business catalogue arrives with later endpoints.
      enum:
        # Foundation
        - VALIDATION_FAILED                 # 400 — request data failed validation; `fields` populated
        - UNAUTHENTICATED                   # 401 — missing/invalid/expired access or session credential
        - FORBIDDEN                         # 403 — policy failure (e.g. untrusted browser origin)
        - NOT_FOUND                         # 404 — resource absent
        - CONFLICT                          # 409 — e.g. duplicate account, already verified
        - FILE_TOO_LARGE                    # 413 — Corporate KYC document over 4 MiB
        - UNSUPPORTED_FILE_TYPE             # 415 — Corporate KYC document signature/type/extension/PDF-structure rejected
        - FEATURE_UNAVAILABLE               # 503 — private document storage not enabled/approved in this deployment
        - SERVICE_UNAVAILABLE               # 503 — dependency temporarily unavailable (e.g. public market data cache/provider)
        - RATE_LIMITED                      # 429 — endpoint throttled
        - INTERNAL_ERROR                    # 500 — unexpected; never leaks internals
        # Authentication (Phase 2B)
        - INVALID_CREDENTIALS               # 401 — identical error for unknown email/wrong password
        - EMAIL_NOT_VERIFIED                # 403 — verification required before login
        - EMAIL_VERIFICATION_INVALID        # 400/404 — wrong code or unknown verificationId
        - EMAIL_VERIFICATION_EXPIRED        # 400 — past the 10-minute lifetime
        - EMAIL_VERIFICATION_CONSUMED       # 409 — code already used (single-use)
        - EMAIL_VERIFICATION_ATTEMPTS_EXCEEDED # 429 — 5-attempt cap reached; code killed
        - RESEND_COOLDOWN                   # 429 — 60-second resend cooldown active
        - RESEND_LIMIT_EXCEEDED             # 429 — 5 resends per hour limit
        - CSRF_VALIDATION_FAILED            # 403 — missing/mismatched signed CSRF pair
        - SESSION_INVALID                   # reserved — session policy failure
        - EMAIL_DELIVERY_FAILED             # 500 — verification email transport failed

  responses:
    FeatureUnavailableError:
      description: Private document storage is not enabled/approved in this deployment (fails closed; nothing stored).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: FEATURE_UNAVAILABLE
              message: Secure document storage is not available.
              requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"
    UnauthorizedError:
      description: Missing/invalid/expired session or bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ForbiddenError:
      description: Authenticated principal is not authorized for this account/resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFoundError:
      description: Resource absent or not owned by the authenticated principal (generic 404).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: Unexpected server error (safe envelope).
      headers:
        x-request-id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
              requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: VALIDATION_FAILED
              message: One or more fields require attention.
              fields:
                password: password must be at least 8 characters
              requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

    ConflictError:
      description: Safe conflict (e.g. duplicate account — no account-state leakage).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: CONFLICT
              message: An account with this email address already exists.
              requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

    RateLimitError:
      description: Throttled (safe envelope with retry hint).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests — please try again later.
              context:
                retryAfterSeconds: 540
              requestId: "3f6b9f1e-2c4d-4a5b-9c8e-7d6f5a4b3c2d"

x-release-lineage:
  pinned-file-reported-version: "0.4.0"
  latest-canonical-release-asserted: false
  note: "Operations documentation in the pinned repository refers to a later canonical 0.6.1 file that is absent from this archive. This additive contract update does not establish release numbering or claim to supersede the latest published contract."

x-conventions:
  success-envelope:
    description: |
      Successful responses use `{ "data": ..., "meta": { "requestId": ... } }`.
      Additional `meta` members are introduced by later endpoint contracts.
  request-id:
    description: |
      Every request has a correlation ID: client-supplied safe `x-request-id`
      values are honoured, otherwise one is generated. Returned in the
      `x-request-id` response header, `meta.requestId`, and `error.requestId`.
  authentication:
    description: |
      IMPLEMENTED (Phase 2B) per the approved architectural direction:
      short-lived (15 min) HS256 JWT access credential (`sub`, `role`, `sid`)
      + opaque 384-bit refresh credential (7-day absolute / 24-hour idle),
      server-side sessions with single-use ROTATION and reuse detection
      (presenting a rotated credential revokes the session).
      Web transport: HttpOnly refresh cookie + readable signed session-bound
      CSRF cookie, `X-CSRF-Token` double-submit, Origin/Referer policy, CORS
      allowlist (credentials enabled only with an explicit allowlist; never "*").
      Core auth/session services are client-neutral so the future mobile app
      uses the same model with platform-secure storage instead of cookies.
  authorization:
    description: |
      Role authorization is enforced server-side (`@Roles()` + RolesGuard
      after bearer-token validation). `UserRole.INVESTOR` is not an account
      category: `primaryAccountType` is persisted separately and immutably
      when assigned; ambiguous legacy users remain null for manual treatment.
      Individual resources require an Individual profile and reject Corporate-
      only identities. Joint data requires current membership (and an Individual
      context). Corporate resources require verified Corporate applicant
      identity plus owner-scoped Corporate application access. Resource
      ownership is always derived from the authenticated principal — request-
      supplied user identifiers and the frontend's unsent login selector are
      never honoured.
  money-and-empty-state:
    description: |
      Phase 2D dashboard contract: all monetary integers are MINOR units
      (kobo for NGN). A new investor has no portfolio/holding/transaction
      rows — that ABSENCE is a normal successful empty dashboard state
      (`totalValueMinor: 0`, `holdings: []`, `data: []`, `total: 0`), NOT an
      error, and the backend NEVER fabricates demo records. No market
      valuation, rates, yields, fees, performance, returns or cost-basis
      logic exists on this contract; `totalReturnMinor` stays `null`.
  throttling:
    description: |
      Server-side fixed-window throttling on authentication-sensitive routes
      (register/login/verify/resend/refresh/logout) via a replaceable limiter
      port (in-memory MVP now; distributed store can replace it later).
  open-decisions:
    description: |
      D-08 (application status/state-transition map) — OPEN.
      D-09 (one-active-application semantics, incl. staff-list selection) — OPEN.
      Corporate KYC document categories are APPROVED as exactly three
      (CERTIFICATE_OF_INCORPORATION, MEMART, TIN_CERTIFICATE); applicant
      submission DRAFT → SUBMITTED is implemented. Staff review outcomes and
      other document vocabularies remain TBD
      (BUSINESS / COMPLIANCE + CONTRACT APPROVAL REQUIRED).
      No contract here may presume those outcomes.
